<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trigger Rules — Trading Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .trig-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .trig-header h1 {
            margin: 0;
            font-size: 24px;
        }
        .trig-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .trig-controls label {
            font-weight: bold;
            margin-right: 4px;
        }
        .trig-controls select,
        .trig-controls input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }
        .status-bar {
            padding: 12px;
            background: #f9f9f7;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-2);
            display: none;
        }
        .status-bar.success {
            background: #dcfce7;
            color: var(--bull);
            display: block;
        }
        .status-bar.error {
            background: #fee2e2;
            color: var(--bear);
            display: block;
        }
        .trig-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .trig-list {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            max-height: 600px;
            overflow-y: auto;
        }
        .trig-list-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            background: white;
            transition: background 0.2s;
        }
        .trig-list-item:hover {
            background: #fafaf8;
        }
        .trig-list-item.active {
            background: var(--accent);
            color: white;
            border-bottom-color: var(--accent);
        }
        .trig-list-item-symbol {
            font-weight: bold;
            font-size: 14px;
        }
        .trig-list-item-info {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.8;
        }
        .trig-detail {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            background: white;
        }
        .trig-detail-empty {
            text-align: center;
            color: var(--text-3);
            padding: 40px 20px;
        }
        .trig-symbol-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }
        .trig-rules-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .trig-rule-row {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fafaf8;
            transition: all 0.2s;
        }
        .trig-rule-row.triggered {
            background: #dcfce7;
            border-color: var(--bull);
            font-weight: 500;
        }
        .trig-rule-row.not-triggered {
            background: #fee2e2;
            border-color: var(--bear);
            opacity: 0.7;
        }
        .trig-rule-code {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .trig-rule-score {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-2);
        }
        .trig-score-value {
            font-weight: bold;
            font-family: monospace;
        }
        .trig-back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
        }
        .trig-back-link:hover {
            text-decoration: underline;
        }
        .trig-filter-info {
            font-size: 12px;
            color: var(--text-3);
            margin-top: 8px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
            font-size: 13px;
        }
        .pagination button {
            padding: 6px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .pagination button:disabled {
            background: var(--text-3);
            cursor: not-allowed;
        }
        .trig-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .trig-stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
            text-align: center;
        }
        .trig-stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }
        .trig-stat-label {
            font-size: 12px;
            color: var(--text-2);
            margin-top: 4px;
        }
    </style>
</head>
<body class="trig-page">
    <header class="topbar">
        <div class="brand">
            <span class="dot"></span>
            <h1>Trading Dashboard</h1>
        </div>
        <nav class="nav-menu">
            <a href="/" class="nav-item">Dashboard</a>
            <a href="/actionable" class="nav-item">Actionable</a>
            <a href="/portfolio" class="nav-item">Portfolio</a>

            <a href="/universe" class="nav-item">Universe</a>
            <a href="/rules" class="nav-item">Rules</a>
      <a href="/groups" class="nav-item">Rule Groups</a>
            <a href="/rule-performance" class="nav-item">Performance</a>
            <a href="/trace" class="nav-item">Trace</a>
      <a href="/rule-flow" class="nav-item">Rule Flow</a>
            
      <a href="/ref" class="nav-item">Ref Data</a>
      <a href="/explore" class="nav-item">DB Data</a>
            <a href="/dbstats" class="nav-item">DB Stats</a>
            <a href="/file-monitor" class="nav-item">File Monitor</a>
        </nav>
        <div class="controls">
            <label for="datePicker">As of</label>
            <select id="datePicker" aria-label="snapshot date"></select>
            <button id="refreshBtn" class="btn">Refresh</button>
            <span id="health" class="badge badge-ok" title="API health">●</span>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="trig-header">
                <div>
                    <h2>Trig Rules Analysis</h2>
                </div>
                <div class="trig-controls">
                    <label for="trigFilter">Filter Triggered:</label>
                    <select id="trigFilter">
                        <option value="">All Rules</option>
                        <option value="true">Triggered Only</option>
                        <option value="false">Not Triggered</option>
                    </select>
                    <label for="compositeFilter" style="margin-left: 16px;">Composite Rule:</label>
                    <select id="compositeFilter">
                        <option value="">All Rules</option>
                    </select>
                </div>
            </div>

            <div class="status-bar" id="statusBar"></div>

            <div class="trig-stats" id="trigStats"></div>

            <div class="trig-container">
                <div class="trig-list" id="trigList"></div>
                <div class="trig-detail" id="trigDetail">
                    <div class="trig-detail-empty">Select a stock to view its triggered rules</div>
                </div>
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevBtn">← Previous</button>
                <span id="pageInfo"></span>
                <button id="nextBtn">Next ←’</button>
            </div>
        </div>
    </main>

    <script src="/static/_common.js"></script>
    <script src="/static/trig.js"></script>
    <script src="/static/rebuild_modal.js"></script>
  <script src="/static/market_bar.js" defer></script>
<script src="/static/warning_badge.js"></script>
</body>
</html>
