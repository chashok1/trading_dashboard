<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ref Table Maintenance — Trading Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .ref-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .ref-header h1 {
            margin: 0;
            font-size: 24px;
        }
        .ref-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .ref-controls select,
        .ref-controls input {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
            color: var(--text-1);
            background: var(--card-bg);
            cursor: pointer;
        }
        .ref-controls input {
            cursor: text;
        }
        .ref-controls button {
            padding: 8px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .ref-controls button:hover {
            opacity: 0.9;
        }
        .ref-controls button:disabled {
            background: var(--text-3);
            cursor: not-allowed;
        }
        .status-bar {
            padding: 12px;
            background: #f9f9f7;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-2);
        }
        .status-bar.success {
            background: #dcfce7;
            color: var(--bull);
        }
        .status-bar.error {
            background: #fee2e2;
            color: var(--bear);
        }
        .ref-table-container {
            max-height: 70vh;
            overflow-x: auto;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .ref-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .ref-table thead {
            background: #fafaf8;
            position: sticky;
            top: 0;
        }
        .ref-table thead th {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-1);
        }
        .ref-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-1);
        }
        .ref-table tbody tr:hover {
            background: #fafaf8;
        }
        .pk-col {
            color: var(--text-3);
            font-style: italic;
        }
        .edit-cell {
            cursor: pointer;
            position: relative;
        }
        .edit-cell input {
            width: 100%;
            padding: 6px;
            border: 1px solid var(--accent);
            border-radius: 3px;
            font-size: 13px;
        }
        .edit-cell input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.1);
        }
        .flash-success {
            animation: flash-green 1s ease-in-out;
        }
        .flash-error {
            animation: flash-red 1s ease-in-out;
        }
        @keyframes flash-green {
            0% { background-color: #dcfce7; }
            50% { background-color: #dcfce7; }
            100% { background-color: transparent; }
        }
        @keyframes flash-red {
            0% { background-color: #fee2e2; }
            50% { background-color: #fee2e2; }
            100% { background-color: transparent; }
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
            font-size: 13px;
        }
        .pagination button {
            padding: 6px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .pagination button:disabled {
            background: var(--text-3);
            cursor: not-allowed;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .filter-section {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            padding: 12px;
            background: #f9f9f7;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .filter-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .filter-group label {
            font-weight: bold;
            font-size: 13px;
        }
        .filter-group input {
            padding: 4px 8px;
            width: 200px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: white;
        }
        .filter-btn {
            padding: 4px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-btn:hover {
            background: #0066cc;
        }
        .filter-clear-btn {
            padding: 4px 12px;
            background: var(--text-3);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-clear-btn:hover {
            background: var(--text-2);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="dot"></span>
            <h1>Trading Dashboard</h1>
        </div>
        <nav class="nav-menu">
            <a href="/" class="nav-item">Dashboard</a>
            <a href="/cockpit" class="nav-item">Cockpit</a>
            <a href="/actionable" class="nav-item">Actionable</a>
            <a href="/portfolio" class="nav-item">Portfolio</a>
            <a href="/rules" class="nav-item">Rules</a>
      <a href="/groups" class="nav-item">Rule Groups</a>
            <a href="/rule-performance" class="nav-item">Performance</a>
            <a href="/trace" class="nav-item">Trace</a>
            <a href="/explore" class="nav-item">DBExplore</a>
            <a href="/ref" class="nav-item active">Ref Data</a>
            <a href="/dbstats" class="nav-item">DB Stats</a>
            <a href="/file-monitor" class="nav-item">File Monitor</a>
        </nav>
        <div class="controls">
            <label for="datePicker">As of</label>
            <select id="datePicker" aria-label="snapshot date"></select>
            <button id="refreshBtn" class="btn">Refresh</button>
            <span id="health" class="badge badge-ok" title="API health">●</span>
        </div>
    </header>

    <input type="file" id="excelFileInput" accept=".xlsx" style="display: none;">

    <main>
        <div class="card">
            <div class="ref-header">
                <div>
                    <label for="tableSelect" style="font-weight: bold; margin-right: 8px;">Table:</label>
                    <select id="tableSelect" style="padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; color: var(--text-1); background: var(--card-bg);">
                        <option value="">Loading tables...</option>
                    </select>
                    <span id="tableInfo" style="margin-left: 12px; color: var(--text-2); font-size: 13px;"></span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button id="reloadBtn" disabled>Reload from Excel</button>
                    <button id="copyRowBtn" disabled>Copy Selected</button>
                    <button id="deleteRowBtn" disabled style="background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5;">Delete Selected</button>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-group">
                    <label for="filterSearch">Search:</label>
                    <input type="text" id="filterSearch" placeholder="Search in table...">
                </div>
                <button id="filterApplyBtn" class="filter-btn">Apply Filter</button>
                <button id="filterClearBtn" class="filter-clear-btn">Clear</button>
            </div>

            <div class="status-bar" id="statusBar" style="display: none;"></div>

            <div class="ref-table-container">
                <table class="ref-table" id="refTable">
                    <thead>
                        <tr id="headerRow">
                            <th style="width: 32px; padding: 12px 6px;"><input type="checkbox" id="selectAll" title="Select all rows on this page"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="20" style="text-align: center; color: var(--text-3); padding: 20px;">
                                Select a table to view
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevBtn">← Previous</button>
                <span id="pageInfo"></span>
                <button id="nextBtn">Next →</button>
            </div>
        </div>
    </main>
    <script src="/static/_common.js"></script>
    <script src="/static/ref.js"></script>
  <script src="/static/health_banner.js"></script>
  <script src="/static/warning_badge.js"></script>
</body>
</html>
