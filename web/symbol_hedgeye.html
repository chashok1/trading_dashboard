<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hedgeye Dossier — Trading Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    main { padding: 12px 16px; max-width: 820px; }
    .ds-bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
    .ds-bar input { padding:4px 8px; border:1px solid var(--border,#ccc); border-radius:4px; font-size:13px; }
    .ds-sec {
      margin-bottom:14px; background:var(--card-bg,#fff); border:1px solid var(--border,#e0e0e0);
      border-radius:6px; padding:10px 12px;
    }
    .ds-sec h3 { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:#534ab7; margin:0 0 5px; }
    table.ds-tbl { border-collapse:collapse; width:100%; font-size:12px; }
    table.ds-tbl th, table.ds-tbl td { border-bottom:1px solid #eee; padding:4px 8px; text-align:left; }
    .rr-box { font-size:13px; padding:8px 10px; border:1px solid #e6e3f5; border-radius:5px; background:#fbfbfe; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>Hedgeye Dossier</h1></div>
    <nav class="nav-menu">
      <a href="/" class="nav-item">Dashboard</a>
      <a href="/actionable" class="nav-item">Actionable</a>
      <a href="/portfolio" class="nav-item">Portfolio</a>

      <a href="/universe" class="nav-item">Universe</a>
      <a href="/rules" class="nav-item">Rules</a>
      <a href="/groups" class="nav-item">Rule Groups</a>
      <a href="/param-sets" class="nav-item">Param Sets</a>
      <a href="/rule-performance" class="nav-item">Performance</a>
      <a href="/trace" class="nav-item">Trace</a>
      <a href="/rule-flow" class="nav-item">Rule Flow</a>
      <a href="/ref" class="nav-item">Ref Data</a>
      <a href="/explore" class="nav-item">DB Data</a>
      <a href="/dbstats" class="nav-item">DB Stats</a>
      <a href="/file-monitor" class="nav-item">File Monitor</a>
      <a href="/ingest-log" class="nav-item">Ingest Log</a>
      <a href="/digest" class="nav-item">Digest</a>
      <a href="/notes" class="nav-item">Notes</a>
    </nav>
  </header>
  <main>
    <div class="ds-bar">
      <input type="text" id="sym" placeholder="Symbol (e.g. AAPL)">
      <button class="btn" id="go">Load</button>
    </div>
    <div id="body"></div>
  </main>
  <script src="/static/_common.js"></script>
  <script src="/static/symbol_hedgeye.js" defer></script>
  <script src="/static/market_bar.js" defer></script>
  <script src="/static/warning_badge.js"></script>
</body>
</html>
