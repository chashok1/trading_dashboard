<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Action Cockpit — Trading Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .cockpit-header {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .cockpit-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cockpit-controls select, .cockpit-controls input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
        }
        .actions-table {
            width: 100%;
            border-collapse: collapse;
        }
        .actions-table thead {
            background: #fafaf8;
            position: sticky;
            top: 0;
        }
        .actions-table th {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-1);
        }
        .actions-table tbody td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-1);
        }
        .actions-table tbody tr:hover {
            background: #fafaf8;
            cursor: pointer;
        }
        .action-code {
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 12px;
        }
        .action-code.SA { background: #fee2e2; color: #991b1b; }
        .action-code.STM { background: #fed7aa; color: #92400e; }
        .action-code.SS { background: #fef3c7; color: #78350f; }
        .action-code.BM { background: #dcfce7; color: #166534; }
        .drawer {
            display: none;
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100%;
            background: white;
            border-left: 1px solid var(--border);
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 1000;
        }
        .drawer.active {
            display: flex;
            flex-direction: column;
        }
        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .drawer-actions {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .drawer-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-took-action {
            background: var(--accent);
            color: white;
        }
        .btn-skip {
            background: var(--text-3);
            color: white;
        }
        .chart-container {
            position: relative;
            height: 200px;
            margin: 20px 0;
        }
        .rules-list {
            list-style: none;
            padding: 0;
        }
        .rules-list li {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        .rule-header {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .rule-detail {
            font-size: 12px;
            color: var(--text-2);
        }
        /* --- Split layout --- */
        .cockpit-split {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .cockpit-table-panel {
            flex: 0 0 42%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            height: 640px;
        }
        .cockpit-table-panel .scrollable-table-container {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        .cockpit-chart-panel {
            flex: 1;
            min-width: 0;
            height: 640px;
            display: flex;
            flex-direction: column;
        }
        .chart-panel-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .chart-panel-header .chart-sym { color: var(--accent); }
        #tv_chart_container {
            flex: 1;
            min-height: 0;
            width: 100%;
        }
        .chart-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-3);
            font-size: 14px;
        }
        /* --- Market context band (macro_band.js) --- */
        .macro-head {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 14px;
        }
        .macro-title { margin: 0; font-size: 16px; color: var(--text-1); }
        .macro-meta {
            display: flex; align-items: center; gap: 12px;
            font-size: 12px; color: var(--text-2);
        }
        .macro-lastfetch.is-throttled { color: var(--text-1); font-weight: 600; }
        .macro-group { margin-bottom: 16px; }
        .macro-group:last-child { margin-bottom: 0; }
        .macro-group-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
            color: var(--text-3); margin: 0 0 8px;
        }
        .macro-tiles {
            display: grid; gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }
        .macro-tile {
            border: 1px solid var(--border); border-radius: 6px;
            padding: 10px 12px; background: #fff;
        }
        .macro-tile .mt-label {
            font-size: 12px; color: var(--text-2); margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .macro-tile .mt-value { font-size: 18px; font-weight: 600; color: var(--text-1); }
        .macro-tile .mt-chg { font-size: 12px; margin-top: 2px; }
        .macro-tile .mt-date { font-size: 10px; color: var(--text-3); margin-top: 4px; }
        .mt-up { color: #166534; }
        .mt-down { color: #991b1b; }
        .mt-flat { color: var(--text-3); }
        .macro-loading, .macro-empty { color: var(--text-3); padding: 12px 0; font-size: 13px; }
        .macro-error { color: #991b1b; padding: 12px 0; font-size: 13px; }
    </style>
</head>
<body class="fill-page">
    <header class="topbar">
        <div class="brand">
            <span class="dot"></span>
            <h1>Trading Dashboard</h1>
        </div>
        <nav class="nav-menu">
            <a href="/" class="nav-item">Dashboard</a>
            <a href="/cockpit" class="nav-item active">Cockpit</a>
            <a href="/actionable" class="nav-item">Actionable</a>
            <a href="/portfolio" class="nav-item">Portfolio</a>
            <a href="/rules" class="nav-item">Rules</a>
      <a href="/groups" class="nav-item">Rule Groups</a>
            <a href="/rule-performance" class="nav-item">Performance</a>
            <a href="/trace" class="nav-item">Trace</a>
      <a href="/rule-flow" class="nav-item">Rule Flow</a>
            
      <a href="/ref" class="nav-item">Ref Data</a>
      <a href="/explore" class="nav-item">DB Data</a>
            <a href="/dbstats" class="nav-item">DB Stats</a>
            <a href="/file-monitor" class="nav-item">File Monitor</a>
        </nav>
        <div class="controls">
            <label for="datePicker">As of</label>
            <select id="datePicker" aria-label="snapshot date"></select>
            <button id="refreshBtn" class="btn">Refresh</button>
            <span id="health" class="badge badge-ok" title="API health">●</span>
        </div>
    </header>

    <main>
        <!-- Filters row -->
        <div class="card" style="margin-bottom:12px; padding:10px 14px;">
            <div class="cockpit-controls">
                <select id="actionFilter">
                    <option value="">All Actions</option>
                    <option value="SA">SA (Sell All)</option>
                    <option value="STM">STM (Sell to Min)</option>
                    <option value="SS">SS (Sell Some)</option>
                    <option value="BM">BM (Buy More)</option>
                </select>
                <select id="sectorFilter">
                    <option value="">All Sectors</option>
                </select>
                <input type="text" id="symbolSearch" placeholder="Search symbol..." style="min-width: 150px;">
            </div>
        </div>

        <!-- Split: table left, chart right -->
        <div class="cockpit-split">
            <div class="cockpit-table-panel card">
                <div class="scrollable-table-container">
                    <table class="actions-table">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Sector</th>
                                <th>Price</th>
                                <th>Action</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody id="actionsTableBody">
                            <tr>
                                <td colspan="5" style="text-align:center; padding:20px; color:var(--text-3);">
                                    Select a date to view actions
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="cockpit-chart-panel card">
                <div class="chart-panel-header">
                    <span id="chartSymbolLabel">Chart</span>
                    <span class="chart-sym" id="chartSymbolTicker"></span>
                </div>
                <div id="tv_chart_container">
                    <div class="chart-placeholder">Click a row to view chart</div>
                </div>
            </div>
        </div>
    </main>

    <div class="drawer" id="detailDrawer">
        <div class="drawer-header">
            <div>
                <h2 id="drawerSymbol"></h2>
                <div id="drawerPrice" style="font-size: 14px; color: var(--text-2);"></div>
            </div>
            <button class="drawer-close" onclick="closeDrawer()">x</button>
        </div>

        <div class="drawer-content">
            <h3>Triggered Atomic Rules</h3>
            <ul class="rules-list" id="atomicRulesList"></ul>

            <h3>Triggered Composite Rules</h3>
            <ul class="rules-list" id="compositeRulesList"></ul>
        </div>

        <div class="drawer-actions">
            <button class="btn-took-action" onclick="logAction('took')">I Took This Action</button>
            <button class="btn-skip" onclick="logAction('skip')">Skip</button>
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="/static/_common.js"></script>
    <script src="/static/cockpit.js"></script>
    <script src="/static/rebuild_modal.js"></script>
  <script src="/static/market_bar.js" defer></script>
<script src="/static/warning_badge.js"></script>
</body>
</html>
