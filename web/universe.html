<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universe — Trading Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css?v=20260910a">
  <style>
    /* Page-scoped tokens -- reuses the app's real :root vars (--bg/--card-bg/
       --border/--text-1..3/--accent/--cat1..9, web/styles.css) for chrome and
       identity color; only the two SEQUENTIAL magnitude ramps (count/capital)
       and the tiny account-nested-treemap chrome are new, both local to this
       page. Built from the "Universe by Sector" prototype (artifact) --
       see git history for that exploration; this is the real, DB-backed
       version: /api/universe, not client-aggregated mock data. */
    /* Real bug, not a guess: several elements this page toggles via the
       `hidden` attribute (JS `.hidden = true`) ALSO carry an explicit
       `display: flex` from their own class (.uv-ctrl-group) -- author CSS
       always wins over the browser's own default `[hidden] { display:
       none }` rule, even at equal specificity, so `.hidden = true` was
       silently doing nothing on #uvFilterRow/#uvColorRow/#uvStyleRow. This
       one override wins over any class's `display` and actually hides
       them. */
    [hidden] { display: none !important; }

    /* Full-width -- no max-width/centering, per the app's standing
       full-width-screens convention (matches every other screen). */
    .uv-wrap { width: 100%; padding: 6px 24px 20px; }
    /* Controls+crumbs (left, stacked) alongside the KPI panel (right),
       stretched via align-items:stretch to match their COMBINED height --
       the KPI panel used to be a child of .uv-hdr alone, confined to just
       that (short) row's height even once it became a 4-row grid. User:
       "take up the space from below line also. where it starts with
       Universe" -- 2026-09-07. */
    .uv-top-row { display: flex; align-items: stretch; gap: 16px; margin-bottom: 6px; }
    .uv-top-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .uv-hdr { display: flex; align-items: center; justify-content: flex-start; gap: 16px;
      flex-wrap: wrap; margin-bottom: 6px; }
    .uv-stat { font-variant-numeric: tabular-nums; color: var(--text-1); font-weight: 700; }
    /* Stats line -- moved onto the crumbs row (right-justified) instead of
       its own header line under a page title; no page title any more
       either. */
    .uv-stats-line { margin: 0; color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
    .uv-stats-line b { color: var(--text-1); font-variant-numeric: tabular-nums; }
    .uv-stats-sep { color: var(--text-3); margin: 0 2px; }
    /* Compact per-item summary line (Account/Asset Class/Source roots) --
       "Symbols: N · Accounts: N · <label>: <a> / <b>, <label>: <a> / <b>,
       ..." replacing the old stats-line + separate "Top X" list at those
       3 levels. Allows wrapping (unlike .uv-stats-line's own nowrap --
       this can run to a dozen+ comma-separated items) with generous line-
       height so a wrapped line doesn't read as cramped. The two per-item
       figures get their own DARK, distinct color + bold, so "which number
       is which" is readable at a glance without having to parse the label
       pattern every time -- this app is light-theme only (no --card-bg
       dark-mode variant exists), so a genuinely dark shade always has
       strong contrast against the white card, unlike cat1/cat2 (tried
       first, 2026-09-08) which read as merely "medium", not dark. Forest
       green (Securities, "money at work") vs a distinct dark blue (Cash,
       "money parked") -- distinct hues, not just distinct lightness, so
       they still read apart for a red/green colorblind viewer. Reuses
       this app's own established tokens (--bull/--cat7, already in
       :root) rather than new hex -- consistent with how every other
       semantic color on this page is sourced.
       2026-09-09 BUGFIX -- the first attempt (raw #166534/#1e3a8a) was
       confirmed correctly applied via DevTools (right class, right rule,
       nothing overriding it) but still read as flat black to the user --
       both were simply too dark to register as anything but black at
       this line's 11.5-12.5px size against white. --bull/--cat7 keep the
       same "dark, not pastel" intent while staying visibly green/blue at
       that size. User: "Use different colors for securities and cash
       with bold font..." -- 2026-09-08, then "use some dark color for
       Securities and different dark color for Cash" -- 2026-09-09, then
       "did a hard refresh, still not showing ... I still see the numbers
       in black" -- 2026-09-09. -->
    .uv-compact-summary { white-space: normal; line-height: 1.7; }
    .uv-compact-summary .uv-m-a { color: var(--bull); font-weight: 700; font-variant-numeric: tabular-nums; }
    .uv-compact-summary .uv-m-b { color: var(--cat7); font-weight: 700; font-variant-numeric: tabular-nums; }
    .uv-compact-summary .uv-cs-label { color: var(--text-2); }

    /* View/Filter/Account controls, all on the header's own line (user:
       "move all the controls to the same line as By controls") -- each is
       its own small group (label + tab strip), laid out inline with a
       divider-ish gap between groups; wraps as a whole onto a second line
       under the title on narrow viewports rather than any one group
       breaking apart. */
    /* Gaps tightened 2026-09-08 -- between groups (uv-hdr-controls),
       within a group (uv-ctrl-group), between buttons (uv-tabs), and each
       button's own padding all cut down, now that most labels are short
       abbreviations (B/S/H/Act/Qd/etc) with less need for the old
       breathing room. User: "reduce the margin between the buttons and
       groups as much as you can by leaving little space." */
    .uv-hdr-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .uv-ctrl-group { display: flex; align-items: center; gap: 3px; }

    .uv-tabs { display: inline-flex; flex-wrap: wrap; padding: 2px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 9px; gap: 1px; }
    .uv-tab { appearance: none; border: 0; background: transparent; color: var(--text-2);
      font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 6px;
      cursor: pointer; white-space: nowrap; transition: background .12s ease, color .12s ease;
      display: inline-flex; align-items: center; gap: 4px; }
    .uv-color-dot { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
    .uv-tab:hover { color: var(--text-1); }
    .uv-tab[aria-selected="true"] { background: var(--accent); color: #fff; }
    .uv-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .uv-tabs.small { padding: 1px; border-radius: 8px; }
    .uv-tabs.small .uv-tab { padding: 3px 6px; font-size: 11.5px; border-radius: 5px; }
    .uv-ctrl-group .uv-fcount { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

    /* Copy Symbols icon button -- this page's own minimal copy of
       actionable.html's .btn-icon look (border+bg instead of that page's
       borderless toolbar style, since this button sits among .uv-tabs
       groups here rather than a dedicated toolbar strip). .uv-copied /
       .uv-copy-error are brief post-click feedback states (a green/red
       flash on the icon+border, plus a "Copied N symbols" title-attribute
       swap -- this page has no shared toast/status mechanism, unlike
       actionable.js's showStatus, see copySymbols' own comment). */
    .uv-icon-btn { display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 6px;
      background: var(--card-bg); color: var(--text-2); cursor: pointer; }
    .uv-icon-btn:hover { color: var(--text-1); border-color: var(--text-3); }
    .uv-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .uv-icon-btn.uv-copied { color: #16a34a; border-color: #16a34a; }
    .uv-icon-btn.uv-copy-error { color: #dc2626; border-color: #dc2626; }

    /* Cursor hint for a control that opens a "what is this?" popover on
       hover/focus (#uvInfoPop, see _uvShowInfoPopover) -- the Risk Range
       slider itself is the first (wireRrSlider), not a separate icon any
       more (removed 2026-09-07, see the slider's own HTML comment). */
    #uvRrSlider { cursor: help; }
    /* Generic info popover shell -- unlike .uv-actpop-shell (copied
       verbatim from actionable.html, hardcoded light-only), this is new
       and follows this page's own convention of theming off the real
       :root vars so it reads correctly in both themes. */
    .uv-infopop-shell { position: fixed; z-index: 1000; display: none;
      background: var(--card-bg); color: var(--text-1); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      padding: 10px 12px; font-size: 11.5px; line-height: 1.5; max-width: 260px;
      pointer-events: none; }
    .uv-infopop-shell b { color: var(--text-1); }
    .uv-infopop-shell ul { margin: 4px 0 0; padding-left: 16px; }
    .uv-infopop-shell li { margin: 2px 0; }

    /* Risk Range dual-thumb slider -- two overlapping native <input
       type=range> elements (classic pattern: shared track drawn
       underneath, only each input's own thumb is clickable via
       pointer-events, the track itself is transparent/inert). */
    /* width shrunk 130px -> 90px 2026-09-08. User: "Reduce the width of
       RR range bar." (Was shared with a .uv-macro-slider dual-thumb
       range bar for one day -- replaced by plain Mcro B/S/H buttons, see
       #uvMacroRow's own comment, so this is RR-only again.) */
    .uv-rr-slider { position: relative; width: 90px; height: 20px; flex: 0 0 auto; }
    .uv-rr-track { position: absolute; top: 8px; left: 2px; right: 2px; height: 3px;
      background: var(--border); border-radius: 2px; }
    .uv-rr-range { position: absolute; top: 0; height: 3px; background: var(--accent); border-radius: 2px; }
    .uv-rr-slider input[type="range"] { position: absolute; top: 0; left: 0; width: 100%; height: 20px;
      margin: 0; background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none; }
    .uv-rr-slider input[type="range"]::-webkit-slider-runnable-track { -webkit-appearance: none; background: transparent; }
    .uv-rr-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto;
      width: 13px; height: 13px; margin-top: 3.5px; border-radius: 50%; background: var(--accent);
      border: 2px solid var(--card-bg); box-shadow: 0 0 0 1px var(--border); cursor: pointer; }
    .uv-rr-slider input[type="range"]::-moz-range-track { background: transparent; border: none; }
    .uv-rr-slider input[type="range"]::-moz-range-thumb { pointer-events: auto; width: 13px; height: 13px;
      border-radius: 50%; background: var(--accent); border: 2px solid var(--card-bg);
      box-shadow: 0 0 0 1px var(--border); cursor: pointer; }

    /* min-height/margin dropped to 0 -- empty most of the time (only
       populated during a drilldown), and its old 26px reserved footprint
       (18px min-height + 8px margin) was most of the "space between
       controls and tiles" the user asked to shrink to 6px total (now
       carried entirely by .uv-hdr's own margin-bottom, below). */
    /* Crumbs row -- breadcrumb trail (left, populated only while drilled
       in) and the symbol-count stats line (right, always shown) on one
       row instead of two separate header lines. */
    .uv-crumbs-row { display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    .uv-crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
    /* Right side of the crumbs row -- stats line + "Top X" legend list,
       kept together as one group (not spread apart by the row's own
       space-between) so they always sit adjacent. User: "you can add the
       bottom legend in the same line as other text that starts with
       Universe." */
    .uv-crumbs-right { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
    .uv-crumb { cursor: pointer; color: var(--accent); }
    .uv-crumb:hover { text-decoration: underline; }
    .uv-crumb.current { color: var(--text-1); font-weight: 700; cursor: default; text-decoration: none; }
    .uv-crumb-sep { color: var(--text-3); }


    .uv-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; }
    .uv-tm-card { padding: 14px; }
    /* Viewport-relative height (was aspect-ratio: 16/9) -- on this
       full-width page, 16:9 against the actual available width could run
       taller than the viewport and force page scroll. calc() targets
       "fits the actual screen" directly instead of guessing a ratio.
       155px is the rest of the page's chrome: 36px topbar + 26px
       .uv-wrap padding (6px top + 20px bottom) + ~46px controls row + 6px
       its margin-bottom + ~24px crumbs/stats/legend row (now ONE row --
       the "Top X" legend folded back into it, see .uv-crumbs-right,
       instead of its own row below the treemap) + card padding.
       Recomputed 2026-08-30 -- was 180px while the legend briefly had its
       own row. min/max keep it sane on very short or very tall windows
       (raised a little further since the legend row's height is reclaimed
       here too -- widen if the crumbs row visibly wraps onto 2 lines
       often with a wide "Top X" list). */
    .uv-svg-wrap { position: relative; width: 100%;
      height: calc(100vh - 155px); min-height: 360px; max-height: 900px; }
    svg.uv-tm { width: 100%; height: 100%; display: block; }

    /* Factor view (ref_quad_outlook table) -- see #uvFactorsWrap's own
       comment. Scrollable card of grouped rows, not a treemap. */
    .uv-factors-wrap { overflow-y: auto; padding: 4px 2px; }
    .uv-factor-group { margin-bottom: 14px; }
    .uv-factor-group-title { font-size: 12px; font-weight: 700; color: var(--text-2);
      text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px 2px; }
    .uv-factor-row { display: grid; grid-template-columns: 1fr repeat(4, 64px);
      align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; }
    .uv-factor-row:nth-child(odd) { background: var(--card-bg-2, rgba(128,128,128,0.06)); }
    .uv-factor-sub { font-size: 12.5px; color: var(--text-1); }
    .uv-factor-pill { text-align: center; font-size: 10.5px; font-weight: 700;
      padding: 3px 4px; border-radius: 4px; }
    .uv-factor-pill.bull { background: rgba(22,163,74,0.16); color: #16a34a; }
    .uv-factor-pill.bear { background: rgba(220,38,38,0.16); color: #dc2626; }
    .uv-factor-pill.neutral { background: rgba(148,163,184,0.16); color: var(--text-3); }
    .uv-factor-pill.dim { opacity: 0.35; }
    .uv-factor-head { display: grid; grid-template-columns: 1fr repeat(4, 64px);
      gap: 6px; padding: 0 8px 4px; font-size: 10.5px; font-weight: 700;
      color: var(--text-3); text-align: center; }
    .uv-factor-head span:first-child { text-align: left; }

    .uv-cell rect.uv-cell-rect { stroke: none; cursor: pointer; }
    .uv-cell text { pointer-events: none; font-family: inherit; }
    /* Header/name text needs its OWN pointer events -- Symbol tiles hover
       this element specifically to open the Action popover (see
       renderSymbolTiles/uv-c-name .on('mouseenter'/'mouseleave') in
       universe.js); re-enabled here (not on the tile as a whole) since the
       blanket `.uv-cell text { pointer-events: none }` above exists so
       every OTHER label still lets clicks/hover fall through to the tile's
       rect underneath. cursor:help signals "hover for detail" the same way
       the rest of the app's rich-popover triggers do. User: "make the
       popover pops up only when i hover over the header, for ex, hover on
       account name, source name, stock name etc" -- 2026-09-06. */
    .uv-cell .uv-c-name { font-weight: 700; pointer-events: auto; cursor: help; }
    .uv-cell .uv-c-sub { font-weight: 500; opacity: .85; }
    /* the "All stocks" corner link needs its OWN click, distinct from the
       tile's click-anywhere-else -- re-enable pointer events just for it
       (the blanket `.uv-cell text { pointer-events: none }` above exists so
       every other label lets clicks fall through to the tile's rect). */
    .uv-cell .uv-c-link { pointer-events: auto; }
    .uv-cell-group:focus-visible rect { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* "Top X" ranked-bucket legend -- was its own side panel, then its own
       bottom row; now folded into .uv-crumbs-right so it shares the same
       line as the breadcrumbs/stats. */
    .uv-legend-label { font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--text-3); flex: 0 0 auto; }
    .uv-rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .uv-rank-row { display: inline-flex; align-items: center; gap: 5px; }
    .uv-rank-dot { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
    .uv-rank-name { font-size: 11.5px; color: var(--text-1); font-weight: 600; white-space: nowrap; }
    .uv-rank-val { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

    #uvTt { position: fixed; z-index: 50; pointer-events: none; background: var(--text-1); color: var(--bg);
      font-size: 11px; line-height: 1.5; padding: 8px 10px; border-radius: 7px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
      max-width: 220px; opacity: 0; transform: translateY(2px); transition: opacity .1s ease; }
    #uvTt.show { opacity: 1; }
    #uvTt .uv-tt-title { font-weight: 700; margin-bottom: 3px; }
    #uvTt .uv-tt-row { display: flex; justify-content: space-between; gap: 10px; opacity: .85; }
    #uvTt .uv-tt-syms { margin-top: 5px; opacity: .7; font-size: 10.5px; }
    #uvTt .uv-tt-hint { margin-top: 5px; opacity: .6; font-size: 10px; font-style: italic; }

    /* 2026-08-30: the sequential magnitude ramps (count/capital) that used
       to live here were dropped -- color is sector/asset-class identity
       everywhere now, see universe.js's own header comment. The nested
       "split each sector tile by account" view (and its .uv-grp-* group
       chrome) was dropped the same day -- By Account's own hierarchy
       covers that angle. */

    @media (prefers-reduced-motion: reduce) {
      .uv-tab, #uvTt { transition: none; }
    }

    /* 2026-09-03 (held-perspective proposal): portfolio-wide KPI summary.
       Page-wide facts (total held, cash, today's gain, realized YTD) --
       NOT re-filtered by the View/Filter/Color controls, which only narrow
       the treemap itself; rendered once from build(), not on every
       render(). Originally its own multi-card strip row (.uv-kpi-strip/
       .uv-kpi-card, same pattern as web/portfolio.html); replaced with 4
       stacked label|value rows (label left, value right) instead of one
       dot-separated line or 4+ full cards. Now a sibling of .uv-top-left
       (not .uv-hdr's own child any more), stretched by .uv-top-row's
       align-items:stretch to the COMBINED height of the controls row +
       crumbs row -- align-content:center spreads the 4 rows to use that
       full height instead of staying squeezed at the top. Was the dot-
       separated line until "display Total .../YTD/Cash/Today vertically
       on the right side in 4 lines so it fits two lines only with small
       font" -- 2026-09-07 (labels left/values right per that same
       request's follow-up note), then "take up the space from below
       line also. where it starts with Universe" -- 2026-09-07 (the
       stretch-to-combined-height part). User (original): "is there a way
       to display Total portfolio/YTD/Cash/Today in concise manner on the
       top filter bar right justified" -- 2026-09-06. */
    .uv-hdr-kpis { display: grid; grid-template-columns: auto auto; column-gap: 10px; row-gap: 1px;
      align-content: center; font-size: 11px; line-height: 1.1; color: var(--text-2);
      font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .uv-hdr-kpis .uv-kpi-label { text-align: left; color: var(--text-3); }
    .uv-hdr-kpis .uv-kpi-val { text-align: right; font-weight: 700; color: var(--text-1); }
    .uv-gain-pos { color: #16a34a; }
    .uv-gain-neg { color: #dc2626; }
  </style>
</head>
<body class="act-page">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Trading Dashboard</h1>
    </div>
    <nav class="nav-menu">
      <a href="/" class="nav-item">Dashboard</a>
      <a href="/actionable" class="nav-item">Actionable</a>
      <a href="/portfolio" class="nav-item">Portfolio</a>

      <a href="/universe" class="nav-item active">Universe</a>
      <a href="/rules" class="nav-item">Rules</a>
      <a href="/groups" class="nav-item">Rule Groups</a>
      <a href="/rule-performance" class="nav-item">Performance</a>
      <a href="/trace" class="nav-item">Trace</a>
      <a href="/rule-flow" class="nav-item">Rule Flow</a>

      <a href="/ref" class="nav-item">Ref Data</a>
      <a href="/explore" class="nav-item">DB Data</a>
      <a href="/dbstats" class="nav-item">DB Stats</a>
      <a href="/file-monitor" class="nav-item">File Monitor</a>

    </nav>
  </header>

  <main class="uv-wrap">
    <!-- uv-top-row: controls+crumbs (left, stacked) alongside the KPI
         panel (right), stretched to match their COMBINED height -- was
         KPIs squeezed into just the controls row's own (short) height;
         see .uv-top-row/.uv-top-left's own CSS comment. User: "take up
         the space from below line also. where it starts with Universe"
         -- 2026-09-07. -->
    <div class="uv-top-row">
    <div class="uv-top-left">
    <div class="uv-hdr">
      <div class="uv-hdr-controls">
        <!-- All | Account | Asset | Src# | Src$ -- one combined radio
             group. "All" used to be a separate on/off toggle button
             (uvAllStocksBtn); Source used to be its own separate tab plus
             a further separate Count/Capital toggle you had to click
             AFTER switching to it (2 clicks to get "Source sized by
             count"). Src#/Src$ collapse that into ONE click each --
             clicking either sets currentView='source' AND sizeMode
             together (see wireStaticControls) -- so there's no standalone
             "Source" button left to click first. All/Account/Asset don't
             get a count/$ split of their own since their tile sizing and
             legend %s are already always dollar-based regardless (the
             "% and $K must match" fix earlier this session) -- there's no
             meaningful "sized by count" variant of those to offer.
             History: "Combine first two radio buttons (By account etc &
             All stocks) into one as All|Account|Asset and separate By
             source into its own as Source" -- 2026-09-06; "Filter
             Count|Capital -> doesn't appply for first three radio button
             options... Always use Capital option" -- 2026-09-06; "Combine
             Source Count|Capital into Src#|Src$ and default to Src#" --
             2026-09-06; "Why do you need Source still? Can we combine
             Src#|Src$ with All|Account|Asset" -- 2026-09-06, which is
             what actually removed the standalone Source/Size rows. -->
        <div class="uv-tabs small" role="tablist" aria-label="Treemap view">
          <button class="uv-tab" role="tab" data-view="all" aria-selected="false">All</button>
          <button class="uv-tab" role="tab" data-view="account" aria-selected="true" title="Account">Act</button>
          <button class="uv-tab" role="tab" data-view="assetclass" aria-selected="false">Asset</button>
          <button class="uv-tab" role="tab" data-view="source" data-size="count" aria-selected="false">Src#</button>
          <button class="uv-tab" role="tab" data-view="source" data-size="capital" aria-selected="false">Src$</button>
          <!-- Factors -- category-level companion to the Q1-Q4 stock
               filter below: which sectors/asset-classes/styles are
               THEMSELVES favorable for a quad (ref_quad_outlook, straight
               reference data), not a treemap of symbols. Swaps the whole
               tile area for a list (see renderFactorsView) -- Filter/
               Color/Style/RR/Macro/Gain rows all hidden here (none apply
               to categories), Quad row stays visible to pick which quad's
               column to highlight. User: "show the stocks or factors
               based on quad favorable" -- 2026-09-08. -->
          <button class="uv-tab" role="tab" data-view="factors" aria-selected="false">Factors</button>
        </div>

        <!-- Hidden under "By Account" -- that view only ever means
             something for held positions (there's no such thing as an
             unheld position "in an account"), so it's forced to Held and
             not a real choice there; see wireStaticControls(). -->
        <div class="uv-ctrl-group" id="uvFilterRow">
          <div class="uv-tabs small" role="tablist" aria-label="Symbol filter">
            <button class="uv-tab" role="tab" data-filter="all" aria-selected="false">All</button>
            <button class="uv-tab" role="tab" data-filter="held" aria-selected="true">Held</button>
            <button class="uv-tab" role="tab" data-filter="actionable" aria-selected="false">Actionable</button>
          </div>
          <span class="uv-fcount" id="uvFilterCount"></span>
        </div>

        <!-- Color filter -- narrows the drilldown (individual stock) tiles
             to one trading-signal color; has no effect until you drill
             all the way down to symbols (see renderSymbolTiles). Hidden
             except at that level -- see atSymbolLevel(). -->
        <div class="uv-ctrl-group" id="uvColorRow">
          <div class="uv-tabs small" role="tablist" aria-label="Stock tile color filter">
            <button class="uv-tab" role="tab" data-color="all" aria-selected="true">All</button>
            <button class="uv-tab" role="tab" data-color="buy" aria-selected="false" title="Buy"><span class="uv-color-dot" style="background:var(--act-buy-strong);"></span>B</button>
            <button class="uv-tab" role="tab" data-color="sell" aria-selected="false" title="Sell"><span class="uv-color-dot" style="background:var(--act-sell-strong);"></span>S</button>
            <button class="uv-tab" role="tab" data-color="hold" aria-selected="false" title="Hold"><span class="uv-color-dot" style="background:var(--act-neutral);"></span>H</button>
          </div>
        </div>

        <!-- Style filter -- a symbol can carry several style tags at once
             (e.g. both "Low Beta" and "Mid Caps"), so this is a filter, not
             a hierarchy level (see the "By Asset Class" research chat) --
             narrows the drilldown tiles to one tag, same scope as Color.
             Populated from ALL_STYLE_TAGS (data-driven, not hardcoded) --
             see wireStyleTabs(). Hidden except at the symbol level, same
             as Color -- see atSymbolLevel(). -->
        <div class="uv-ctrl-group" id="uvStyleRow">
          <div class="uv-tabs small" role="tablist" aria-label="Style filter" id="uvStyleTabs"></div>
        </div>

        <!-- Risk Range slider -- narrows the drilldown (individual stock)
             tiles to a Risk Range position band (0-100%, clamped -- same
             scale renderSymbolTiles' own mini RR bar uses). Symbol level
             only, same visibility rule as Color/Style -- see
             atSymbolLevel(). User: "have a new filter risk range slider
             -> slider should filter the stocks based on that (display it
             only on the stocks)." Visible "RR" label + hover tooltip
             added (2026-09-07) -- the slider itself had no on-screen
             label at all before this, just an aria-label a sighted user
             never sees. Title text is \n-separated (own line per fact),
             not the flat middot-joined form -- native title tooltips
             can't render real <li> bullets, this is the closest
             structured equivalent. User: "add small text on the top
             and/or popover for slider on what it is? RR" -- 2026-09-07. -->
        <div class="uv-ctrl-group" id="uvRrRow">
          <!-- Was a plain "RR" text label with a native title tooltip
               (2026-09-07), then a separate "ⓘ" icon next to the slider
               (2026-09-07) opening a real styled popover (see
               _uvShowInfoPopover); the icon itself is gone now -- hovering
               (or keyboard-focusing either thumb of) the range bar ITSELF
               opens the same popover instead, no separate element to
               notice/hover first. User: "remove label 'RR' and use
               popover to tell me what it is" -- 2026-09-07, then "remove
               the i next to RR instead just do a popover on the range bar
               itself" -- 2026-09-07. -->
          <div class="uv-rr-slider" id="uvRrSlider" aria-label="What is Risk Range?">
            <div class="uv-rr-track"><div class="uv-rr-range" id="uvRrRange"></div></div>
            <input type="range" id="uvRrMin" min="0" max="100" value="0" step="1" aria-label="Risk Range minimum">
            <input type="range" id="uvRrMax" min="0" max="100" value="100" step="1" aria-label="Risk Range maximum">
          </div>
        </div>

        <!-- Macro filter -- same single-select 3-bucket shape as Color's
             own Buy/Sell/Hold just below, keyed off the MACRO badge's own
             vocab (macro_value: BM/BS/HOLD/STM/SA -> B/S/H, see
             universe.js::macroSide) instead of a raw macronet range.
             Symbol level only, same visibility rule as RR/Quad. Was a
             dual-thumb macronet range slider (2026-09-08), replaced same
             day: "Instead of macro range bar, use buttons Mcro B S H." -->
        <div class="uv-ctrl-group" id="uvMacroRow">
          <div class="uv-tabs small" role="tablist" aria-label="Macro filter">
            <button class="uv-tab" role="tab" data-macro="all" aria-selected="true">Mcro</button>
            <button class="uv-tab" role="tab" data-macro="buy" aria-selected="false" title="Macro Bullish (BM/BS)">B</button>
            <button class="uv-tab" role="tab" data-macro="sell" aria-selected="false" title="Macro Bearish (STM/SA)">S</button>
            <button class="uv-tab" role="tab" data-macro="hold" aria-selected="false" title="Macro Hold">H</button>
          </div>
        </div>

        <!-- Quad favorability filter -- Q1-Q4, each symbol's ISOLATED
             stance for that specific quad (quad{N}_net -- "if Quad N were
             certain", drv_macro_score, computed alongside macronet but
             ignoring the real near/far window blending macronet itself
             uses). Symbol level only, same visibility rule as RR/Macro.
             Multi-select toggle group (role="group"/role="button", NOT
             role="tablist"/role="tab" like every other single-select
             filter row here -- tablist semantics assume exactly one
             selected tab, which no longer holds once more than one quad
             can be picked at once); still driven by aria-selected (JS-
             toggled, see universe.js's own sync), matching every other
             filter row's existing convention rather than introducing a
             one-off aria-pressed attribute nothing else here uses. "Quad"
             clears the whole selection,
             Q1-Q4 each toggle independently; selecting several narrows to
             symbols favorable for ALL of them (AND), not any one. User:
             "add Q1|Q2|Q3|Q4 filter -> show the stocks or factors based on
             quad favorable" -- 2026-09-08, then "allow selecting more than
             one quad ... select the stocks applicable to selected quads"
             -- 2026-09-08. -->
        <div class="uv-ctrl-group" id="uvQuadRow">
          <div class="uv-tabs small" role="group" aria-label="Quad favorability filter (multi-select)">
            <button class="uv-tab" role="button" aria-selected="true" data-quad="all" title="Quad">Qd</button>
            <button class="uv-tab" role="button" aria-selected="false" data-quad="1" title="Symbols with a net-bullish isolated stance IF Quad 1 were certain">Q1</button>
            <button class="uv-tab" role="button" aria-selected="false" data-quad="2" title="Symbols with a net-bullish isolated stance IF Quad 2 were certain">Q2</button>
            <button class="uv-tab" role="button" aria-selected="false" data-quad="3" title="Symbols with a net-bullish isolated stance IF Quad 3 were certain">Q3</button>
            <button class="uv-tab" role="button" aria-selected="false" data-quad="4" title="Symbols with a net-bullish isolated stance IF Quad 4 were certain">Q4</button>
          </div>
        </div>

        <!-- Unrealized gain% filter -- EVERY tile level now, rollups
             included (Account/Asset Class/Sector/Source root tiles, not
             just individual symbol tiles) -- always visible, no
             atSymbolLevel() gating any more. Rollup tiles use each GROUP's
             own aggregate gain% (costGainPct off computeScopedBreakdown/
             acctGain/etc., the same figure already shown on that tile's own
             P&L block) since there's no single symbol to test there -- see
             filterByGain's own comment. All/Gains/Losses, same 3-tab shape
             as the Color filter (a symbol or group with no cost basis data
             is excluded from both Gains and Losses, same "can't tell" rule
             the RR filter uses for a null rawRrPos). Was a min/max range
             slider (2026-09-07); replaced with this simpler All/Gains/
             Losses toggle per direct request -- see git history for the
             slider version if that's ever wanted back. User: "instead of a
             slider have a 2 button radio buttons. gains and losses" --
             2026-09-07, then "Can we apply this filter for all screens?"
             -- 2026-09-07 (symbol tiles only, at first), then "Why can't i
             use it all levels?" -- 2026-09-07 (extended to rollups too). -->
        <div class="uv-ctrl-group" id="uvGainRow">
          <div class="uv-tabs small" role="tablist" aria-label="Unrealized gain filter">
            <button class="uv-tab" role="tab" data-gain="all" aria-selected="true">All</button>
            <button class="uv-tab" role="tab" data-gain="gains" aria-selected="false">Gains</button>
            <button class="uv-tab" role="tab" data-gain="losses" aria-selected="false">Losses</button>
          </div>
          <!-- Tile SIZE -- symbol-tile level only (see renderSymbolTiles);
               hidden at rollup levels since it has no effect there (those
               still size by capital/count, sizeMode, untouched by this
               feature). % (the original/default) sizes by |Unrealized
               gain%|, $ sizes by |Unrealized gain $|, = makes every tile
               the same size (a flat grid -- gain%/$ still shows as text on
               each tile, it just stops driving the tile's area). All three
               are independent of the All/Gains/Losses filter (that always
               narrows by %, regardless of which sizing is picked). User:
               "gains and losses -> provide $ % to display the tiles based
               on the $ or %" -- 2026-09-07, then "one more option ... so i
               can see all tiles with same dimentions" -- 2026-09-07. -->
          <div class="uv-tabs small" role="tablist" aria-label="Tile size basis" id="uvGainSizeGroup">
            <button class="uv-tab" role="tab" data-gainsize="pct" aria-selected="false">%</button>
            <button class="uv-tab" role="tab" data-gainsize="dollar" aria-selected="false">$</button>
            <button class="uv-tab" role="tab" data-gainsize="equal" aria-selected="true" title="Equal-size tiles">=</button>
            <!-- Sig% -- SSS-only tile size, sizes by |SSS pct_delta
                 ("Signal Strength")| instead of Unrealized gain. Hidden
                 (id-targeted, not [data-gainsize]) unless drilled into the
                 SSS source -- see universe.js render()'s own auto-reset
                 comment. User: "i need to see the universe for Source SSS
                 based on Signal Strength %" -- 2026-09-08. -->
            <button class="uv-tab" role="tab" data-gainsize="signal" aria-selected="false" id="uvSigSizeBtn" title="Size by SSS Signal Strength %" hidden>Sig%</button>
            <!-- Rank -- PS-only. Sizes tiles by position $ (capital) AND
                 reorders the treemap layout by PS rank ascending (rank 1
                 first) instead of by size -- see universe.js's own
                 sortFn comment in renderSymbolTiles. Hidden unless drilled
                 into the PS source, same rule as Sig% above. User:
                 "Similarly for PS use rank (ordering) and position sizing
                 (for size of tiles)" -- 2026-09-08. -->
            <button class="uv-tab" role="tab" data-gainsize="position" aria-selected="false" id="uvRankSizeBtn" title="Order by PS rank, size by position $" hidden>Rank</button>
          </div>
          <!-- Copy Symbols -- same visibility rule as the $/% size toggle
               just above (symbol-tile level only; no rollup-tile
               equivalent, a rollup tile is a group of symbols, not one --
               see visibleSymbols' own comment in universe.js). Folded
               into this same row (rather than its own .uv-ctrl-group,
               2026-09-07) so it doesn't wrap onto its own otherwise-empty
               line on a narrower window -- "don't take up the whole line
               for it." Same icon + recipe as web/actionable.js's own
               #copySymbolsBtn/copySymbols(), this page's own scoped copy
               since each page keeps its own (see .uv-rr-slider's own
               "act-" renamed copy in actionable.html for the established
               convention). User: "add copy button on all universe
               screens to copy the stock symbols like on actionalble
               screen" -- 2026-09-07. -->
          <button class="uv-icon-btn" id="uvCopySymbolsBtn" title="Copy visible symbols (comma-separated)" aria-label="Copy visible symbols">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <div class="uv-crumbs-row">
      <div class="uv-crumbs" id="uvCrumbs"></div>
      <div class="uv-crumbs-right">
        <p class="uv-stats-line" id="uvStatsLine"><span class="uv-stat" id="uvTotalCount">—</span> symbols across <span class="uv-stat" id="uvTotalSectors">—</span> <span id="uvSectorsUnit">sectors</span>, as of <span class="uv-stat" id="uvAsOf">—</span>.
          <span class="uv-stats-sep">·</span> Held <b id="uvSHeld">—</b>
          <span class="uv-stats-sep">·</span> Capital <b id="uvSCapital">—</b>
          <span class="uv-stats-sep">·</span> Largest <b id="uvSLargest">—</b></p>
        <span class="uv-stats-sep">·</span>
        <span class="uv-legend-label" id="uvSideHeading">Top sectors</span>
        <ul class="uv-rank-list" id="uvRankList"></ul>
        <!-- Shared compact one-line summary -- "Symbols: N · Accounts: N ·
             <label>: <a> / <b>, <label>: <a> / <b>, ..." -- replaces the
             normal stats-line + Top-list pair entirely at the Account/
             Asset Class/Source ROOT levels (see universe.js::
             buildCompactSummaryLine + its 3 callers: renderAccountRoot,
             renderHierarchy's asset-class-root branch, renderSourceRoot).
             ONE shared element, not one per level -- only one of those
             three is ever the active view at once. Hidden by default;
             toggled opposite uvStatsLine/uvSideHeading/uvRankList in
             render()'s own reset. User: "display: Symbols: 56, Accounts:
             6, F-M: 224K/$-215K, IRA: etc instead of [the multi-line
             stats+Top-accounts layout]" -- 2026-09-08, then "Use different
             colors for securities and cash with bold font ... Also do
             this for other levels" -- 2026-09-08. -->
        <p class="uv-stats-line uv-compact-summary" id="uvCompactSummary" hidden></p>
      </div>
    </div>
    </div>

    <div class="uv-hdr-kpis" id="uvHdrKpis"></div>
    </div>

    <div class="uv-panel uv-tm-card">
      <div class="uv-svg-wrap"><svg class="uv-tm" id="uvTm"></svg></div>
      <!-- Factor view -- see the "Factors" tab's own comment above. Plain
           HTML rows (category/sub_category + a colored pill per quad),
           not SVG -- this is ~dozens of reference rows, not hundreds of
           positioned tiles, so a treemap buys nothing here and a table
           reads better. Hidden by default; toggled opposite .uv-svg-wrap
           in universe.js's render(). -->
      <div class="uv-svg-wrap uv-factors-wrap" id="uvFactorsWrap" hidden></div>
    </div>
  </main>

  <div id="uvTt"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <!-- Action popover port: window.outlookColor/actionDisplay/actionText/
       escapeHtml/fmtUsd globals the ported popover code (from
       web/actionable.js) depends on. Loaded before universe.js, same order
       actionable.html uses. window.mtTip.candleSvg (market_bar.js) is
       deliberately NOT loaded here -- that file auto-inits DOM widgets
       specific to actionable.html's own market-bar elements that don't
       exist on this page; universe.js replicates just the one candleSvg
       function it needs instead (credited at its own definition). User:
       "Also display the same popover that is being displayed in Actionable
       screen -> Action column -> Action popover" -- 2026-09-06. -->
  <script src="/static/_common.js?v=1"></script>
  <script src="/static/actions.js?v=1"></script>
  <script src="/static/universe.js?v=133"></script>
</body>
</html>
