<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explore — Trading Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Prevent body scrollbar for Explore page */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            margin: 0;
        }
        .card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .explore-table-container {
            flex: 1;
        }

        .explore-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .explore-header h1 {
            margin: 0;
            font-size: 24px;
        }
        .explore-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .explore-controls label {
            font-weight: bold;
            margin-right: 4px;
        }
        .explore-controls select,
        .explore-controls input {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
            color: var(--text-1);
            background: var(--card-bg);
            cursor: pointer;
        }
        .explore-controls input {
            cursor: text;
        }
        .date-changed {
            border-color: var(--bear) !important;
            color: var(--bear) !important;
        }
        .status-bar {
            padding: 12px;
            background: #f9f9f7;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-2);
        }
        .status-bar.success {
            background: #dcfce7;
            color: var(--bull);
        }
        .status-bar.error {
            background: #fee2e2;
            color: var(--bear);
        }
        .explore-table-container {
            max-height: 70vh;
            overflow-x: auto;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .explore-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .explore-table thead {
            background: #fafaf8;
            position: sticky;
            top: 0;
        }
        .explore-table thead th {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-1);
        }
        .explore-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-1);
            word-break: break-word;
        }
        .explore-table tbody tr:hover {
            background: #fafaf8;
        }
        .pk-col {
            color: var(--text-3);
            font-style: italic;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
            font-size: 13px;
        }
        .pagination button {
            padding: 6px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .pagination button:disabled {
            background: var(--text-3);
            cursor: not-allowed;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .table-info {
            color: var(--text-2);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .explore-header-spacer {
            margin-left: auto;
        }
        .inline-pagination {
            display: none;
            gap: 6px;
            align-items: center;
        }
        .inline-pagination.visible {
            display: flex;
        }
        .inline-pagination button {
            padding: 4px 8px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .inline-pagination button:disabled {
            background: var(--text-3);
            cursor: not-allowed;
        }
        .inline-pagination button:hover:not(:disabled) {
            background: #0066cc;
        }
        .explore-table thead th {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease;
        }
        .explore-table thead th:hover {
            background: #f0f0ed;
        }
        .sort-indicator {
            display: inline-block;
            width: 12px;
            margin-left: 4px;
            font-size: 11px;
            color: var(--accent);
        }
        .filter-section {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            padding: 12px;
            background: #f9f9f7;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .filter-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .filter-group label {
            font-weight: bold;
            font-size: 13px;
        }
        .filter-group input {
            padding: 4px 8px;
            width: 140px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: white;
        }
        .filter-btn {
            padding: 4px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-btn:hover {
            background: #0066cc;
        }
        .filter-clear-btn {
            padding: 4px 12px;
            background: var(--text-3);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-clear-btn:hover {
            background: var(--text-2);
        }
        .file-link {
            color: var(--accent);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="dot"></span>
            <h1>Trading Dashboard</h1>
        </div>
        <nav class="nav-menu">
            <a href="/" class="nav-item">Dashboard</a>
            <a href="/cockpit" class="nav-item">Cockpit</a>
            <a href="/actionable" class="nav-item">Actionable</a>
            <a href="/portfolio" class="nav-item">Portfolio</a>
            <a href="/rules" class="nav-item">Rules</a>
      <a href="/groups" class="nav-item">Rule Groups</a>
            <a href="/rule-performance" class="nav-item">Performance</a>
            <a href="/trace" class="nav-item">Trace</a>
            <a href="/explore" class="nav-item active">Explore</a>
            <a href="/ref" class="nav-item">Ref Data</a>
            <a href="/dbstats" class="nav-item">DB Stats</a>
            <a href="/file-monitor" class="nav-item">File Monitor</a>
        </nav>
        <div class="controls">
            <label for="datePicker">As of</label>
            <select id="datePicker" aria-label="snapshot date"></select>
            <button id="refreshBtn" class="btn">Refresh</button>
            <span id="health" class="badge badge-ok" title="API health">●</span>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="explore-header">
                <label for="tableSelect" style="font-weight: bold;">Table:</label>
                <select id="tableSelect" style="padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; color: var(--text-1); background: var(--card-bg);">
                    <option value="">Loading tables...</option>
                </select>
                <span id="rowsDisplay" class="table-info" style="margin-left: 8px;"></span>
                <div class="explore-header-spacer"></div>
                <div class="inline-pagination">
                    <button id="inlinePrevBtn">← Prev</button>
                    <span id="inlinePageInfo" style="font-size: 12px; min-width: 80px; text-align: center;"></span>
                    <button id="inlineNextBtn">Next →</button>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-group">
                    <label for="filterSymbol">Symbol:</label>
                    <input type="text" id="filterSymbol" placeholder="e.g., AAPL" maxlength="20">
                </div>
                <div class="filter-group">
                    <label for="filterDate">Date:</label>
                    <input type="date" id="filterDate">
                </div>
                <button id="filterApplyBtn" class="filter-btn">Apply Filters</button>
                <button id="filterClearBtn" class="filter-clear-btn">Clear</button>
            </div>

            <div id="filterInfoBar" style="padding: 6px 10px; margin: 6px 0 8px; background: #f7f7f5; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; color: var(--text-2); display: none;">
                <strong style="text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; color: var(--text-3);">Showing:</strong>
                <span id="filterInfoText" style="margin-left: 6px; font-family: ui-monospace, 'SF Mono', Consolas, monospace;"></span>
            </div>

            <div class="explore-table-container">
                <table class="explore-table" id="exploreTable">
                    <thead>
                        <tr id="headerRow"></tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="20" style="text-align: center; color: var(--text-3); padding: 20px;">
                                Select a table to view
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="status-bar" id="statusBar" style="display: none;"></div>

            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevBtn">← Previous</button>
                <span id="pageInfo"></span>
                <button id="nextBtn">Next →</button>
            </div>
        </div>
    </main>

    <script src="/static/_common.js"></script>
    <script src="/static/explore.js"></script>
  <script src="/static/health_banner.js"></script>
  <script src="/static/warning_badge.js"></script>
</body>
</html>
