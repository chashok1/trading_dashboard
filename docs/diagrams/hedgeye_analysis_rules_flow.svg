<svg viewBox="0 0 920 820" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Hedgeye ANALYSIS and RULES dataflow</title>
<desc>Analysis and rules side. Parsers emit notes, images and flags. Dispatch automatically writes note_repo and hist_media every email. Rule_candidate and llm_analysis tables exist but are populated only by human-led or optional steps, not the ingest path.</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#7c7c7c"/>
</marker>
<marker id="a3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#7c7c7c" opacity="0.7"/>
</marker>
</defs>
<style>
.box{fill:#ffffff;stroke:#444;stroke-width:1.5;}
.raw{fill:#f4f4f2;stroke:#bbb;stroke-width:1;}
.hd{fill:#1a1a1a;font-size:14px;font-weight:700;}
.t{fill:#1a1a1a;font-size:12.5px;font-weight:650;}
.s{fill:#444;font-size:11.5px;}
.mono{fill:#444;font-size:11px;font-family:ui-monospace,monospace;}
.mut{fill:#777;font-size:10.5px;}
.e{stroke:#7c7c7c;stroke-width:1.6;fill:none;}
.ed{stroke:#7c7c7c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;opacity:0.85;}
</style>
<rect x="30" y="20" width="270" height="120" rx="8" class="raw"/>
<text class="hd" x="44" y="42">ANALYSIS emails</text>
<text class="s" x="44" y="63">Early Look - Key Takeaways</text>
<text class="s" x="44" y="82">Market Situation - prose + charts</text>
<text class="s" x="44" y="101">Macro Show - TL;DR + summary</text>
<text class="s" x="44" y="120">Top 3 . Macro Week . (Unknown)</text>
<rect x="320" y="20" width="270" height="120" rx="8" class="raw"/>
<text class="hd" x="334" y="42">RULES-flavored</text>
<text class="s" x="334" y="63">Quarterly Outlook - Quad thesis</text>
<text class="mut" x="334" y="80">  flag: quarterly_rule_review</text>
<text class="s" x="334" y="101">RTA coaching notes (from DATA feed)</text>
<text class="s" x="334" y="120">Inflation Nowcast direction note</text>
<line class="e" x1="165" y1="140" x2="165" y2="168" marker-end="url(#a3)"/>
<line class="e" x1="455" y1="140" x2="455" y2="168" marker-end="url(#a3)"/>
<rect x="120" y="170" width="380" height="48" rx="8" class="box"/>
<text class="t" x="310" y="190" text-anchor="middle">parsers.py to Parsed</text>
<text class="mono" x="310" y="208" text-anchor="middle">.notes[]   .images[]   .flags[]</text>
<line class="e" x1="310" y1="218" x2="310" y2="246" marker-end="url(#a3)"/>
<text class="mut" x="326" y="237">dispatch()</text>
<line class="e" x1="240" y1="248" x2="150" y2="288" marker-end="url(#a3)"/>
<line class="e" x1="330" y1="248" x2="330" y2="288" marker-end="url(#a3)"/>
<line class="e" x1="400" y1="248" x2="520" y2="288" marker-end="url(#a3)"/>
<rect x="30" y="290" width="240" height="92" rx="8" class="box"/>
<text class="t" x="44" y="312">_write_notes()  to note_repo</text>
<text class="s" x="44" y="332">snippet + tickers[] + theme_tags[]</text>
<text class="s" x="44" y="350">+ quad + signal_kind + gmail_link</text>
<text class="mut" x="44" y="370">deterministic . always on . no body stored</text>
<rect x="285" y="290" width="170" height="92" rx="8" class="box"/>
<text class="t" x="295" y="312">archive_images()</text>
<text class="s" x="295" y="332">download PNGs to</text>
<text class="mono" x="295" y="350">image_dir/</text>
<text class="mut" x="295" y="370">rows to hist_media</text>
<rect x="470" y="290" width="160" height="92" rx="8" class="raw"/>
<text class="t" x="480" y="312">flags to logged</text>
<text class="s" x="480" y="332">correction to reverse</text>
<text class="s" x="480" y="350">review_unclassified</text>
<text class="mut" x="480" y="370">quarterly_rule_review</text>
<rect x="660" y="290" width="230" height="92" rx="8" class="raw"/>
<text class="t" x="675" y="312">every email</text>
<text class="mono" x="675" y="332">meta_hedgeye_msg</text>
<text class="s" x="675" y="350">dedupe + status='ok'</text>
<text class="mut" x="675" y="370">Gmail = archive (id only)</text>
<line x1="30" y1="404" x2="890" y2="404" stroke="#bbb" stroke-dasharray="2 4"/>
<text class="mut" x="30" y="420">automatic, no-LLM ingest path (runs headless every poll)</text>
<text class="mut" x="890" y="420" text-anchor="end">human-led / optional</text>
<line class="e" x1="150" y1="382" x2="150" y2="436" marker-end="url(#a3)"/>
<rect x="40" y="438" width="230" height="56" rx="8" class="box"/>
<text class="t" x="155" y="460" text-anchor="middle">note_repo  (searchable corpus)</text>
<text class="s" x="155" y="480" text-anchor="middle">powers per-symbol dossier + review</text>
<line class="ed" x1="270" y1="466" x2="360" y2="466" marker-end="url(#a3d)"/>
<text class="mut" x="315" y="458" text-anchor="middle">you cluster</text>
<rect x="362" y="438" width="250" height="56" rx="8" class="box" stroke-dasharray="5 4"/>
<text class="t" x="487" y="458" text-anchor="middle">rule_candidate</text>
<text class="s" x="487" y="478" text-anchor="middle">table exists . not auto-filled</text>
<line class="ed" x1="612" y1="466" x2="700" y2="466" marker-end="url(#a3d)"/>
<text class="mut" x="656" y="458" text-anchor="middle">test+promote</text>
<rect x="702" y="438" width="188" height="56" rx="8" class="raw"/>
<text class="t" x="796" y="458" text-anchor="middle">ref_trig_* / MACRO</text>
<text class="s" x="796" y="478" text-anchor="middle">v_rule_scorecard gate</text>
<line class="ed" x1="155" y1="494" x2="155" y2="540" marker-end="url(#a3d)"/>
<text class="mut" x="170" y="520">on request only</text>
<rect x="40" y="542" width="290" height="64" rx="8" class="box" stroke-dasharray="5 4"/>
<text class="t" x="185" y="564" text-anchor="middle">llm_analysis  (optional, cached)</text>
<text class="s" x="185" y="584" text-anchor="middle">display-only . never triggers a trade/rule</text>
<text class="mut" x="185" y="600" text-anchor="middle">local/self-hosted (licensing) . not auto-filled</text>
<rect x="40" y="650" width="850" height="120" rx="8" class="box"/>
<text class="hd" x="56" y="674">Reading the lines</text>
<line x1="56" y1="696" x2="104" y2="696" class="e" marker-end="url(#a3)"/>
<text class="s" x="116" y="700">solid - automatic runtime path; fires on every email, no model involved</text>
<line x1="56" y1="722" x2="104" y2="722" class="ed" marker-end="url(#a3d)"/>
<text class="s" x="116" y="726">dashed - human-led or optional; the table is scaffolded but the ingest path never writes it</text>
<text class="mut" x="56" y="752">Today's pipeline auto-populates note_repo + hist_media only. rule_candidate (no API yet) and llm_analysis (no runtime writer)</text>
<text class="mut" x="56" y="767">await the interactive rule-builder / optional enrichment steps described in the design doc.</text>
</svg>
