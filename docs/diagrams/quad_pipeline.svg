<svg width="100%" viewBox="0 0 680 952" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Quad regime to MACRO: how a stock gets scored</title>
<desc>Five-stage pipeline: memberships, weighted monthly net per quad, monthly blend (ramp/lead) plus a fixed quarterly anchor to MacroNet, alignment conviction matrix, money outputs.</desc>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/></marker>
<style>
.t{font:14px system-ui,sans-serif;fill:#1f2937}
.th{font:600 14px system-ui,sans-serif;fill:#1f2937}
.ts{font:12px system-ui,sans-serif;fill:#6b7280}
.lab{font:600 13px system-ui,sans-serif;fill:#2563eb}
.bull{font:600 13px system-ui,sans-serif;fill:#16a34a}
.bear{font:600 13px system-ui,sans-serif;fill:#dc2626}
.reg{fill:none;stroke:#94a3b8;stroke-dasharray:4 4}
.box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
.chip{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.25}
.gl{stroke:#cbd5e1;stroke-width:1}
</style>
</defs>
<text class="th" x="40" y="28" style="font-size:15px">How a stock gets scored: quad regime &#8594; MACRO</text>
<text class="ts" x="40" y="46">Your bottom-up call &#215; the macro regime &#8594; one verdict, re-ranked every day</text>

<rect class="reg" x="44" y="60" width="592" height="138" rx="10"/>
<text class="lab" x="58" y="80">1 &#183; One stock, many categories &#8212; each has Bullish / Bearish / Neutral per quad</text>
<rect class="chip" x="72" y="92" width="165" height="26" rx="6"/><text class="ts" x="154" y="109" text-anchor="middle">Asset class</text>
<rect class="chip" x="255" y="92" width="165" height="26" rx="6"/><text class="ts" x="337" y="109" text-anchor="middle">Sector</text>
<rect class="chip" x="438" y="92" width="165" height="26" rx="6"/><text class="ts" x="520" y="109" text-anchor="middle">Cap size</text>
<rect class="chip" x="72" y="124" width="165" height="26" rx="6"/><text class="ts" x="154" y="141" text-anchor="middle">Value / growth</text>
<rect class="chip" x="255" y="124" width="165" height="26" rx="6"/><text class="ts" x="337" y="141" text-anchor="middle">Cyclical / defensive</text>
<rect class="chip" x="438" y="124" width="165" height="26" rx="6"/><text class="ts" x="520" y="141" text-anchor="middle">Leverage</text>
<rect class="chip" x="72" y="156" width="165" height="26" rx="6"/><text class="ts" x="154" y="173" text-anchor="middle">Quality</text>
<rect class="chip" x="255" y="156" width="165" height="26" rx="6"/><text class="ts" x="337" y="173" text-anchor="middle">Dividend</text>
<rect class="chip" x="438" y="156" width="165" height="26" rx="6"/><text class="ts" x="520" y="173" text-anchor="middle">Momentum</text>
<line x1="340" y1="198" x2="340" y2="236" class="gl" marker-end="url(#ar)"/>

<rect class="reg" x="44" y="212" width="592" height="86" rx="10"/>
<text class="lab" x="58" y="232">2 &#183; Weight by the month's quad % &#8594; one net score</text>
<rect class="box" x="120" y="240" width="440" height="48" rx="8"/>
<text class="th" x="340" y="262" text-anchor="middle">net = sector &#215;2 + asset &#215;1 + each style &#215;0.5</text>
<text class="ts" x="340" y="280" text-anchor="middle">each outlook weighted by Quad % (Bullish +1 / Neutral 0 / Bearish &#8722;1)</text>
<line x1="340" y1="298" x2="340" y2="344" class="gl" marker-end="url(#ar)"/>

<rect class="reg" x="44" y="314" width="592" height="244" rx="10"/>
<text class="lab" x="58" y="334">3 &#183; Month blends now&#8594;next (ramp/lead) &#183; Quarter is a fixed anchor</text>
<rect class="box" x="60" y="348" width="126" height="42" rx="8"/><text class="th" x="123" y="367" text-anchor="middle">Month &#183; now</text><text class="ts" x="123" y="382" text-anchor="middle">weighted net</text>
<rect class="box" x="192" y="348" width="126" height="42" rx="8"/><text class="th" x="255" y="367" text-anchor="middle">Month &#183; next</text><text class="ts" x="255" y="382" text-anchor="middle">weighted net</text>
<rect class="box" x="360" y="348" width="126" height="42" rx="8"/><text class="th" x="423" y="367" text-anchor="middle">Qtr &#183; now</text><text class="ts" x="423" y="382" text-anchor="middle">fixed</text>
<rect class="box" x="492" y="348" width="126" height="42" rx="8"/><text class="th" x="555" y="367" text-anchor="middle">Qtr &#183; next</text><text class="ts" x="555" y="382" text-anchor="middle">near qtr-end</text>
<line x1="123" y1="390" x2="172" y2="430" class="gl" marker-end="url(#ar)"/>
<line x1="255" y1="390" x2="236" y2="430" class="gl" marker-end="url(#ar)"/>
<line x1="423" y1="390" x2="420" y2="430" class="gl" marker-end="url(#ar)"/>
<line x1="555" y1="390" x2="556" y2="430" class="gl" marker-end="url(#ar)"/>
<rect class="box" x="118" y="430" width="172" height="44" rx="8"/><text class="th" x="204" y="450" text-anchor="middle">M = blend now&#8594;next</text><text class="ts" x="204" y="466" text-anchor="middle">ramp begins &#8594; lead days</text>
<rect class="box" x="360" y="430" width="120" height="44" rx="8"/><text class="th" x="420" y="450" text-anchor="middle">Quarter</text><text class="ts" x="420" y="466" text-anchor="middle">fixed anchor</text>
<rect class="box" x="494" y="430" width="124" height="44" rx="8" stroke="#d97706"/><text class="th" x="556" y="450" text-anchor="middle">Turn alert</text><text class="ts" x="556" y="466" text-anchor="middle">next qtr, near end</text>
<line x1="204" y1="474" x2="288" y2="500" class="gl" marker-end="url(#ar)"/>
<line x1="420" y1="474" x2="368" y2="500" class="gl" marker-end="url(#ar)"/>
<line x1="556" y1="474" x2="556" y2="498" class="gl" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text class="ts" x="566" y="490" text-anchor="start" fill="#d97706">flag</text>
<rect class="box" x="230" y="500" width="200" height="46" rx="8" stroke="#2563eb"/>
<text class="th" x="330" y="522" text-anchor="middle">MacroNet = a&#183;Qtr + b&#183;M</text>
<text class="ts" x="330" y="538" text-anchor="middle">Quarter anchor + Month timing</text>
<line x1="330" y1="546" x2="362" y2="598" class="gl" marker-end="url(#ar)"/>

<rect class="reg" x="44" y="574" width="592" height="176" rx="10"/>
<text class="lab" x="58" y="594">4 &#183; Conviction = your signal &#215; the regime (Technical is master)</text>
<rect class="box" x="58" y="602" width="542" height="124" rx="6" fill="none"/>
<line x1="150" y1="602" x2="150" y2="726" class="gl"/>
<line x1="300" y1="602" x2="300" y2="726" class="gl"/>
<line x1="450" y1="602" x2="450" y2="726" class="gl"/>
<line x1="58" y1="632" x2="600" y2="632" class="gl"/>
<line x1="58" y1="663" x2="600" y2="663" class="gl"/>
<line x1="58" y1="694" x2="600" y2="694" class="gl"/>
<text class="ts" x="104" y="613" text-anchor="middle">signal &#8595;</text>
<text class="ts" x="104" y="626" text-anchor="middle">regime &#8594;</text>
<text class="bull" x="225" y="621" text-anchor="middle">Bullish</text>
<text class="ts" x="375" y="621" text-anchor="middle">Neutral</text>
<text class="bear" x="525" y="621" text-anchor="middle">Bearish</text>
<text class="th" x="104" y="652" text-anchor="middle">Buy</text>
<text class="th" x="104" y="683" text-anchor="middle">Neutral</text>
<text class="th" x="104" y="714" text-anchor="middle">Sell</text>
<text class="bull" x="225" y="652" text-anchor="middle">PRESS LONG</text>
<text class="t" x="375" y="652" text-anchor="middle">Long</text>
<text class="bear" x="525" y="652" text-anchor="middle">CONFLICT</text>
<text class="ts" x="225" y="683" text-anchor="middle">Watch long</text>
<text class="ts" x="375" y="683" text-anchor="middle">&#8212;</text>
<text class="ts" x="525" y="683" text-anchor="middle">Watch short</text>
<text class="t" x="225" y="714" text-anchor="middle">Dip &#183; don't short</text>
<text class="t" x="375" y="714" text-anchor="middle">Short</text>
<text class="bear" x="525" y="714" text-anchor="middle">PRESS short / exit</text>
<text class="ts" x="340" y="742" text-anchor="middle">action stays Technical's &#183; cell sets conviction + flag only</text>
<line x1="375" y1="750" x2="342" y2="792" class="gl" marker-end="url(#ar)"/>

<rect class="reg" x="44" y="766" width="592" height="118" rx="10"/>
<text class="lab" x="58" y="786">5 &#183; What you see &#8212; the money</text>
<rect class="box" x="55" y="794" width="185" height="74" rx="8"/>
<text class="th" x="147" y="816" text-anchor="middle">Re-ranked list</text>
<text class="ts" x="147" y="834" text-anchor="middle">aligned trades rise</text>
<text class="ts" x="147" y="850" text-anchor="middle">conflicts sink + flag</text>
<rect class="box" x="250" y="794" width="185" height="74" rx="8"/>
<text class="th" x="342" y="816" text-anchor="middle">Turn alert</text>
<text class="ts" x="342" y="834" text-anchor="middle">now-vs-next gap</text>
<text class="ts" x="342" y="850" text-anchor="middle">= trim into strength</text>
<rect class="box" x="445" y="794" width="185" height="74" rx="8"/>
<text class="th" x="537" y="816" text-anchor="middle">Rotation list</text>
<text class="ts" x="537" y="834" text-anchor="middle">next-quarter winners</text>
<text class="ts" x="537" y="850" text-anchor="middle">add &#183; losers trim</text>

<rect x="120" y="906" width="10" height="10" rx="2" fill="#16a34a"/><text class="ts" x="136" y="915">Bullish / press</text>
<rect x="270" y="906" width="10" height="10" rx="2" fill="#dc2626"/><text class="ts" x="286" y="915">Bearish / conflict</text>
<rect x="440" y="906" width="10" height="10" rx="2" fill="#cbd5e1"/><text class="ts" x="456" y="915">Neutral / watch</text>
</svg>
