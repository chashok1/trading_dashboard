<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="ui-monospace,monospace" font-size="11">
  <rect width="880" height="320" fill="#f8fafc"/>
  <text x="440" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Quad → MACRO Pipeline</text>

  <!-- DATA SOURCES -->
  <rect x="10" y="40" width="140" height="56" rx="5" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="55" text-anchor="middle" fill="#475569" font-weight="700" font-size="9.5">DATA SOURCES</text>
  <text x="80" y="69" text-anchor="middle" fill="#64748b" font-size="9">ref_quad_periods</text>
  <text x="80" y="81" text-anchor="middle" fill="#64748b" font-size="9">(monthly pcts + qtr quad)</text>
  <text x="80" y="93" text-anchor="middle" fill="#64748b" font-size="9">ref_quad_outlook (+1/0/-1)</text>

  <rect x="10" y="106" width="140" height="44" rx="5" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="121" text-anchor="middle" fill="#475569" font-weight="700" font-size="9.5">SYMBOL ATTRIBUTES</text>
  <text x="80" y="135" text-anchor="middle" fill="#64748b" font-size="9">drv_ma: sector, asset_class,</text>
  <text x="80" y="147" text-anchor="middle" fill="#64748b" font-size="9">beta, P/E, RSI, div_yield, mktcap</text>

  <line x1="150" y1="68" x2="165" y2="68" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="165" y1="68" x2="165" y2="128" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="150" y1="128" x2="178" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 1-2 -->
  <rect x="180" y="50" width="155" height="155" rx="5" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="180" y="50" width="155" height="20" rx="5" fill="#1d4ed8"/>
  <rect x="180" y="64" width="155" height="6" fill="#1d4ed8"/>
  <text x="257" y="64" text-anchor="middle" fill="#fff" font-weight="700" font-size="9.5">STAGE 1-2: MEMBERSHIP NET</text>
  <text x="257" y="83" text-anchor="middle" fill="#64748b" font-size="9">Classify style from fundamentals:</text>
  <text x="257" y="95" text-anchor="middle" fill="#475569" font-size="8.5">High/Low Beta, Cyclical/Defensive</text>
  <text x="257" y="107" text-anchor="middle" fill="#475569" font-size="8.5">Value/Secular, Dividend, Momentum</text>
  <text x="257" y="119" text-anchor="middle" fill="#475569" font-size="8.5">Small/Mid Cap</text>
  <line x1="190" y1="124" x2="325" y2="124" stroke="#e2e8f0"/>
  <text x="257" y="136" text-anchor="middle" fill="#64748b" font-size="9">Per membership:</text>
  <text x="257" y="148" text-anchor="middle" fill="#1e40af" font-size="8.5">stance = Sk(pct_k/100) x outlook_k</text>
  <line x1="190" y1="154" x2="325" y2="154" stroke="#e2e8f0"/>
  <text x="257" y="166" text-anchor="middle" fill="#64748b" font-size="9">Aggregate:</text>
  <text x="257" y="178" text-anchor="middle" fill="#1e40af" font-size="8.5">net = sector*2 + asset*1 + S(style*0.5)</text>
  <text x="257" y="193" text-anchor="middle" fill="#64748b" font-size="8">now_net and next_net per horizon</text>

  <line x1="335" y1="128" x2="363" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 3 -->
  <rect x="365" y="50" width="190" height="155" rx="5" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
  <rect x="365" y="50" width="190" height="20" rx="5" fill="#4f46e5"/>
  <rect x="365" y="64" width="190" height="6" fill="#4f46e5"/>
  <text x="460" y="64" text-anchor="middle" fill="#fff" font-weight="700" font-size="9.5">STAGE 3: RAMP + COMBINE</text>

  <rect x="375" y="76" width="170" height="48" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="460" y="88" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="9">MONTHLY (pct distribution)</text>
  <text x="460" y="100" text-anchor="middle" fill="#1e40af" font-size="8.5">w = ramp(days to month-end, 12d to 5d)</text>
  <text x="460" y="113" text-anchor="middle" fill="#1e40af" font-size="8.5">M = (1-w)*now_net + w*next_net</text>

  <rect x="375" y="130" width="170" height="48" rx="3" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="460" y="142" text-anchor="middle" fill="#3730a3" font-weight="600" font-size="9">QUARTERLY (one-hot)</text>
  <text x="460" y="154" text-anchor="middle" fill="#3730a3" font-size="8.5">w = ramp(days to qtr-end, 20d to 10d)</text>
  <text x="460" y="167" text-anchor="middle" fill="#3730a3" font-size="8.5">Q = (1-w)*now_net + w*next_net</text>

  <rect x="375" y="184" width="170" height="15" rx="3" fill="#fffbeb" stroke="#fde68a"/>
  <text x="460" y="195" text-anchor="middle" fill="#92400e" font-weight="700" font-size="9">MacroNet = 0.65*M + 0.35*Q</text>

  <line x1="555" y1="128" x2="583" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 4 -->
  <rect x="585" y="80" width="130" height="95" rx="5" fill="#fff" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="585" y="80" width="130" height="20" rx="5" fill="#059669"/>
  <rect x="585" y="94" width="130" height="6" fill="#059669"/>
  <text x="650" y="94" text-anchor="middle" fill="#fff" font-weight="700" font-size="9.5">STAGE 4: THRESHOLD</text>
  <text x="650" y="112" text-anchor="middle" fill="#64748b" font-size="8.5">macronet_threshold_* (ref_settings)</text>
  <rect x="595" y="118" width="110" height="50" rx="3" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="650" y="130" text-anchor="middle" fill="#166534" font-weight="700" font-size="9">1.5 = SA</text>
  <text x="650" y="142" text-anchor="middle" fill="#166534" font-size="9">0.5 = BM   0 = HOLD</text>
  <text x="650" y="154" text-anchor="middle" fill="#991b1b" font-size="9">-0.5 = STM   -1.5 = SS</text>

  <line x1="715" y1="128" x2="743" y2="128" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- OUTPUT -->
  <rect x="745" y="70" width="125" height="115" rx="5" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="745" y="70" width="125" height="20" rx="5" fill="#d97706"/>
  <rect x="745" y="84" width="125" height="6" fill="#d97706"/>
  <text x="807" y="84" text-anchor="middle" fill="#fff" font-weight="700" font-size="9.5">OUTPUT</text>
  <text x="807" y="102" text-anchor="middle" fill="#475569" font-size="9">drv_macro_score</text>
  <text x="807" y="114" text-anchor="middle" fill="#64748b" font-size="8.5">macronet (numeric)</text>
  <text x="807" y="126" text-anchor="middle" fill="#64748b" font-size="8.5">macro_action (SA/BM/...)</text>
  <line x1="755" y1="132" x2="865" y2="132" stroke="#e2e8f0"/>
  <text x="807" y="146" text-anchor="middle" fill="#475569" font-size="9">Actionable UI</text>
  <text x="807" y="158" text-anchor="middle" fill="#64748b" font-size="8.5">MACRO column:</text>
  <text x="807" y="170" text-anchor="middle" fill="#64748b" font-size="8.5">badge + score sub-label</text>

  <!-- PRECEDENCE -->
  <rect x="585" y="200" width="130" height="55" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="650" y="215" text-anchor="middle" fill="#991b1b" font-weight="700" font-size="9">STAGE 5: PRECEDENCE</text>
  <text x="650" y="229" text-anchor="middle" fill="#7f1d1d" font-size="8.5">Technical = master</text>
  <text x="650" y="241" text-anchor="middle" fill="#7f1d1d" font-size="8.5">MACRO: conviction only</text>
  <text x="650" y="253" text-anchor="middle" fill="#7f1d1d" font-size="8.5">never flips the action</text>

  <!-- BOTTOM note -->
  <rect x="10" y="240" width="555" height="56" rx="5" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="287" y="256" text-anchor="middle" fill="#475569" font-weight="700" font-size="9">DERIVE TRIGGER</text>
  <text x="287" y="270" text-anchor="middle" fill="#64748b" font-size="8.5">derive_all() calls _derive_macro_impl after drv_ma. Skips gracefully when ref_quad_periods is empty.</text>
  <text x="287" y="284" text-anchor="middle" fill="#64748b" font-size="8.5">Idempotent (DELETE+INSERT). API prefers drv_macro_score; falls back to query-time calc when NULL.</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
