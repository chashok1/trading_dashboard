<svg width="100%" viewBox="0 0 680 268" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ref_quad_periods table design with monthly quad distribution</title>
<desc>ref_quad_periods gains quad1_pct..quad4_pct columns. Monthly rows populate the percentages (sum 100); quarterly rows keep a single top-level quad with NULL percentages.</desc>
<style>
.t{font:12px system-ui,sans-serif;fill:#1f2937}
.s{font:11px system-ui,sans-serif;fill:#6b7280}
.b{font:600 12px system-ui,sans-serif;fill:#1f2937}
.h{font:600 11px system-ui,sans-serif;fill:#374151}
.mono{font:11.5px ui-monospace,monospace;fill:#1f2937}
.null{font:11.5px ui-monospace,monospace;fill:#9ca3af}
</style>
<text class="b" x="40" y="24" style="font-size:14px">ref_quad_periods — table design</text>

<!-- NEW columns highlight -->
<rect x="300" y="40" width="248" height="206" fill="#2563eb0d" stroke="#2563eb" stroke-width="1.25" stroke-dasharray="4 4" rx="4"/>
<text class="s" x="424" y="54" text-anchor="middle" fill="#2563eb">NEW — monthly quad distribution (sum 100)</text>

<!-- header -->
<line x1="40" y1="62" x2="640" y2="62" stroke="#cbd5e1"/>
<line x1="40" y1="90" x2="640" y2="90" stroke="#cbd5e1"/>
<text class="h" x="48" y="80">period_type</text>
<text class="h" x="150" y="80">period</text>
<text class="h" x="232" y="80">quad</text>
<text class="h" x="312" y="80">quad1_pct</text>
<text class="h" x="380" y="80">quad2_pct</text>
<text class="h" x="448" y="80">quad3_pct</text>
<text class="h" x="516" y="80">quad4_pct</text>
<text class="h" x="588" y="80">label</text>

<!-- rows -->
<text class="mono" x="48" y="112">monthly</text><text class="mono" x="150" y="112">Jun-26</text><text class="mono" x="232" y="112">Quad 2</text>
<text class="mono" x="320" y="112" text-anchor="middle">0</text><text class="mono" x="388" y="112" text-anchor="middle">76</text><text class="mono" x="456" y="112" text-anchor="middle">0</text><text class="mono" x="524" y="112" text-anchor="middle">24</text><text class="s" x="588" y="112">Jun-26</text>

<text class="mono" x="48" y="138">monthly</text><text class="mono" x="150" y="138">Jul-26</text><text class="mono" x="232" y="138">Quad 1</text>
<text class="mono" x="320" y="138" text-anchor="middle">54</text><text class="mono" x="388" y="138" text-anchor="middle">6</text><text class="mono" x="456" y="138" text-anchor="middle">4</text><text class="mono" x="524" y="138" text-anchor="middle">36</text><text class="s" x="588" y="138">Jul-26</text>

<line x1="40" y1="152" x2="640" y2="152" stroke="#eef2f7"/>
<text class="mono" x="48" y="174">quarterly</text><text class="mono" x="150" y="174">Q2-26</text><text class="mono" x="232" y="174">Quad 3</text>
<text class="null" x="320" y="174" text-anchor="middle">NULL</text><text class="null" x="388" y="174" text-anchor="middle">NULL</text><text class="null" x="456" y="174" text-anchor="middle">NULL</text><text class="null" x="524" y="174" text-anchor="middle">NULL</text><text class="s" x="588" y="174">Q2-26</text>

<text class="mono" x="48" y="200">quarterly</text><text class="mono" x="150" y="200">Q3-26</text><text class="mono" x="232" y="200">Quad 1</text>
<text class="null" x="320" y="200" text-anchor="middle">NULL</text><text class="null" x="388" y="200" text-anchor="middle">NULL</text><text class="null" x="456" y="200" text-anchor="middle">NULL</text><text class="null" x="524" y="200" text-anchor="middle">NULL</text><text class="s" x="588" y="200">Q3-26</text>

<line x1="40" y1="214" x2="640" y2="214" stroke="#cbd5e1"/>
<text class="s" x="40" y="232">PK (period_type, start_date) &#183; existing: start_date, end_date, quad, label &#183; quad = argmax (band label)</text>
<text class="s" x="40" y="248">Monthly: percentages populated &#183; Quarterly: single top-level quad, percentages NULL (different calculation)</text>
</svg>
