<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="ui-monospace,monospace" font-size="11">

  <!-- Background -->
  <rect width="960" height="460" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">MacroNet Score — Per-Stock Calculation</text>

  <!-- ── STAGE 1: Symbol Memberships ── -->
  <rect x="10" y="50" width="148" height="340" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="10" y="50" width="148" height="22" rx="6" fill="#334155"/>
  <rect x="10" y="66" width="148" height="6" fill="#334155"/>
  <text x="84" y="65" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">SYMBOL MEMBERSHIPS</text>

  <text x="84" y="95" text-anchor="middle" fill="#64748b" font-size="9.5">category weight</text>

  <rect x="20" y="103" width="128" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="84" y="116" text-anchor="middle" fill="#1d4ed8" font-weight="600" font-size="10">Sector  ×2</text>

  <rect x="20" y="128" width="128" height="20" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="84" y="141" text-anchor="middle" fill="#166534" font-weight="600" font-size="10">Asset Class  ×1</text>

  <text x="84" y="167" text-anchor="middle" fill="#64748b" font-size="9.5">style factors  ×0.5 each</text>
  <text x="28" y="183" fill="#475569" font-size="9.5">Beta (Sensitivity)</text>
  <text x="28" y="197" fill="#475569" font-size="9.5">P/E (Value)</text>
  <text x="28" y="211" fill="#475569" font-size="9.5">Mkt Cap (Scale)</text>
  <text x="28" y="225" fill="#475569" font-size="9.5">FCF/Share (Solvency)</text>
  <text x="28" y="239" fill="#475569" font-size="9.5">EPS (Quality)</text>
  <text x="28" y="253" fill="#475569" font-size="9.5">Div Yield (Dividend)</text>
  <text x="28" y="267" fill="#475569" font-size="9.5">RSI (Momentum)</text>

  <line x1="84" y1="278" x2="84" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="20" y="291" width="128" height="38" rx="3" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="84" y="305" text-anchor="middle" fill="#92400e" font-size="9">outlook(Quad k)</text>
  <text x="84" y="318" text-anchor="middle" fill="#92400e" font-weight="700" font-size="10">+1 / 0 / −1</text>
  <text x="84" y="332" text-anchor="middle" fill="#92400e" font-size="8.5">Bullish / Neutral / Bearish</text>

  <text x="84" y="366" text-anchor="middle" fill="#64748b" font-size="9">ref_quad_outlook</text>
  <text x="84" y="380" text-anchor="middle" fill="#64748b" font-size="9">ref_quad_periods</text>

  <!-- Arrow right from memberships -->
  <line x1="158" y1="220" x2="178" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── MONTHLY TRACK ── -->
  <!-- Monthly Stance box -->
  <rect x="180" y="60" width="190" height="145" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="180" y="60" width="190" height="22" rx="6" fill="#1d4ed8"/>
  <rect x="180" y="76" width="190" height="6" fill="#1d4ed8"/>
  <text x="275" y="75" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">MONTHLY STANCE</text>

  <text x="275" y="98" text-anchor="middle" fill="#64748b" font-size="9">distribution-weighted per membership</text>
  <rect x="190" y="103" width="170" height="28" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="275" y="115" text-anchor="middle" fill="#1e40af" font-size="9">stance = Σk (quad_pct_k / 100) × outlook_k</text>
  <text x="275" y="127" text-anchor="middle" fill="#1e40af" font-size="9">e.g. 76% Quad2 · 24% Quad4</text>

  <text x="275" y="148" text-anchor="middle" fill="#64748b" font-size="9">aggregate memberships</text>
  <rect x="190" y="153" width="170" height="28" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="275" y="165" text-anchor="middle" fill="#1e40af" font-size="9">month_net = sector×2 + asset×1</text>
  <text x="275" y="177" text-anchor="middle" fill="#1e40af" font-size="9">+ Σ(style × 0.5)</text>

  <text x="275" y="198" text-anchor="middle" fill="#64748b" font-size="9">compute for current month AND next month</text>

  <!-- Monthly Ramp box -->
  <rect x="180" y="205" width="190" height="100" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="180" y="205" width="190" height="20" rx="6" fill="#3b82f6"/>
  <rect x="180" y="219" width="190" height="6" fill="#3b82f6"/>
  <text x="275" y="219" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">MONTHLY RAMP / LEAD</text>

  <rect x="190" y="230" width="170" height="42" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="275" y="242" text-anchor="middle" fill="#1e40af" font-size="9">w = clamp((12 − ref_days) / (12−5), 0, 1)</text>
  <text x="275" y="254" text-anchor="middle" fill="#1e40af" font-size="9">M = (1−w)·now_net + w·next_net</text>
  <text x="275" y="268" text-anchor="middle" fill="#60a5fa" font-size="8.5">w=0% mid-month → w=100% at 5d to month-end</text>

  <text x="275" y="294" text-anchor="middle" fill="#1d4ed8" font-weight="700" font-size="11">M  (monthly score)</text>

  <!-- ── QUARTERLY TRACK ── -->
  <!-- Quarterly Stance box -->
  <rect x="180" y="315" width="190" height="70" rx="6" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
  <rect x="180" y="315" width="190" height="22" rx="6" fill="#4f46e5"/>
  <rect x="180" y="331" width="190" height="6" fill="#4f46e5"/>
  <text x="275" y="330" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">QUARTERLY STANCE</text>

  <rect x="190" y="340" width="170" height="28" rx="3" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="275" y="352" text-anchor="middle" fill="#3730a3" font-size="9">stance = 1.0 × outlook(active_quad)</text>
  <text x="275" y="364" text-anchor="middle" fill="#3730a3" font-size="9">same aggregation as monthly  (one-hot)</text>

  <!-- Quarterly Ramp box -->
  <rect x="180" y="392" width="190" height="52" rx="6" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
  <rect x="180" y="392" width="190" height="20" rx="6" fill="#6366f1"/>
  <rect x="180" y="406" width="190" height="6" fill="#6366f1"/>
  <text x="275" y="406" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">QUARTERLY RAMP / LEAD</text>

  <rect x="190" y="416" width="170" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="275" y="425" text-anchor="middle" fill="#3730a3" font-size="9">Q = (1−w)·now_net + w·next_net</text>
  <text x="275" y="434" text-anchor="middle" fill="#818cf8" font-size="8.5">w=0% mid-qtr → w=100% at 10d to qtr-end (ramp from 20d)</text>

  <!-- label -->
  <text x="275" y="455" text-anchor="middle" fill="#4f46e5" font-weight="700" font-size="11">Q  (quarterly score)</text>

  <!-- Arrows from monthly boxes to combine -->
  <line x1="370" y1="290" x2="430" y2="290" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="370" y1="440" x2="410" y2="440" x2="410" y2="370" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="410" y1="370" x2="430" y2="320" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr-indigo)"/>

  <!-- Also draw arrow from Stage1 to quarterly track -->
  <line x1="158" y1="350" x2="178" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── COMBINE ── -->
  <rect x="432" y="250" width="185" height="120" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="432" y="250" width="185" height="22" rx="6" fill="#d97706"/>
  <rect x="432" y="266" width="185" height="6" fill="#d97706"/>
  <text x="524" y="265" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">COMBINE</text>

  <rect x="442" y="278" width="165" height="36" rx="3" fill="#fffbeb" stroke="#fde68a"/>
  <text x="524" y="292" text-anchor="middle" fill="#92400e" font-weight="700" font-size="12">MacroNet = 0.65·M + 0.35·Q</text>
  <text x="524" y="308" text-anchor="middle" fill="#b45309" font-size="9">monthly overweights quarterly</text>

  <text x="524" y="332" text-anchor="middle" fill="#64748b" font-size="9">per-stock score  (range approx −3 to +3)</text>
  <text x="524" y="346" text-anchor="middle" fill="#64748b" font-size="9">same formula for every symbol</text>
  <text x="524" y="360" text-anchor="middle" fill="#92400e" font-weight="600" font-size="10">MacroNet</text>

  <!-- Arrow to threshold -->
  <line x1="617" y1="310" x2="650" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── THRESHOLD → ACTION ── -->
  <rect x="652" y="245" width="140" height="130" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="652" y="245" width="140" height="22" rx="6" fill="#059669"/>
  <rect x="652" y="261" width="140" height="6" fill="#059669"/>
  <text x="722" y="260" text-anchor="middle" fill="#fff" font-weight="700" font-size="10.5">THRESHOLD MAP</text>

  <text x="722" y="285" text-anchor="middle" fill="#64748b" font-size="9">macronet_threshold_* in ref_settings</text>

  <rect x="662" y="292" width="120" height="72" rx="3" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="722" y="306" text-anchor="middle" fill="#166534" font-weight="700" font-size="10.5">SA</text>
  <text x="722" y="318" text-anchor="middle" fill="#166534" font-size="9">Strong Buy  (high +)</text>
  <line x1="672" y1="322" x2="772" y2="322" stroke="#bbf7d0"/>
  <text x="722" y="333" text-anchor="middle" fill="#166534" font-size="9">STM  /  BM</text>
  <line x1="672" y1="337" x2="772" y2="337" stroke="#bbf7d0"/>
  <text x="722" y="348" text-anchor="middle" fill="#64748b" font-size="9">HOLD  (near 0)</text>
  <line x1="672" y1="352" x2="772" y2="352" stroke="#bbf7d0"/>
  <text x="722" y="362" text-anchor="middle" fill="#991b1b" font-size="9">SS  /  STM−</text>

  <text x="722" y="385" text-anchor="middle" fill="#64748b" font-size="9">→ MACRO column on Actionable</text>

  <!-- ── PRECEDENCE NOTE ── -->
  <rect x="820" y="50" width="132" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="886" y="67" text-anchor="middle" fill="#991b1b" font-weight="700" font-size="10">PRECEDENCE</text>
  <text x="886" y="83" text-anchor="middle" fill="#7f1d1d" font-size="9">Technical = master</text>
  <text x="886" y="96" text-anchor="middle" fill="#7f1d1d" font-size="9">MACRO never flips</text>
  <text x="886" y="109" text-anchor="middle" fill="#7f1d1d" font-size="9">the action — only</text>
  <text x="886" y="122" text-anchor="middle" fill="#7f1d1d" font-size="9">adjusts conviction</text>
  <text x="886" y="135" text-anchor="middle" fill="#7f1d1d" font-size="9">+ flags conflicts</text>

  <!-- Arrow from Action to Precedence -->
  <line x1="792" y1="260" x2="820" y2="130" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- ── LEGEND ramp zones ── -->
  <rect x="432" y="60" width="360" height="78" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="612" y="77" text-anchor="middle" fill="#475569" font-weight="700" font-size="10">RAMP ZONES  (same logic, different windows)</text>

  <!-- Monthly ramp mini bar -->
  <text x="448" y="95" fill="#3b82f6" font-size="9" font-weight="600">Monthly</text>
  <rect x="510" y="84" width="120" height="12" rx="2" fill="#dbeafe"/>
  <rect x="510" y="84" width="90" height="12" rx="2" fill="#93c5fd"/>
  <rect x="510" y="84" width="50" height="12" rx="2" fill="#3b82f6"/>
  <text x="514" y="93" fill="#1e40af" font-size="8">100% now</text>
  <text x="565" y="93" fill="#1e40af" font-size="8">ramp</text>
  <text x="608" y="93" fill="#fff" font-size="8">100% next</text>
  <text x="514" y="105" fill="#64748b" font-size="8">mid-month</text>
  <text x="591" y="105" fill="#64748b" font-size="8">12d</text>
  <text x="615" y="105" fill="#64748b" font-size="8">5d  month-end</text>

  <!-- Quarterly ramp mini bar -->
  <text x="448" y="127" fill="#6366f1" font-size="9" font-weight="600">Quarterly</text>
  <rect x="510" y="116" width="200" height="12" rx="2" fill="#e0e7ff"/>
  <rect x="510" y="116" width="150" height="12" rx="2" fill="#a5b4fc"/>
  <rect x="510" y="116" width="80" height="12" rx="2" fill="#6366f1"/>
  <text x="514" y="125" fill="#3730a3" font-size="8">100% now</text>
  <text x="590" y="125" fill="#3730a3" font-size="8">ramp</text>
  <text x="650" y="125" fill="#fff" font-size="8">100% next</text>
  <text x="514" y="137" fill="#64748b" font-size="8">mid-quarter</text>
  <text x="651" y="137" fill="#64748b" font-size="8">20d</text>
  <text x="681" y="137" fill="#64748b" font-size="8">10d  qtr-end</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-indigo" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6366f1"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#fca5a5"/>
    </marker>
  </defs>

</svg>
