<svg width="100%" viewBox="0 0 680 758" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Rules engine evaluation logic</title>
  <desc>A vertical pipeline showing how a per-symbol signal is scored: indicator inputs feed atomic rules, which feed composite rules, which feed rule groups, producing drv_stks and then the consolidated action in drv_actionable.</desc>
  <style>
  svg{background:#ffffff;}
  text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#57564E;}
  .th{font-size:14px;font-weight:600;}
  .ts{font-size:11.5px;}
  .arr{stroke:#888780;stroke-width:1.6;fill:none;}
  .box rect{fill:#F1EFE8;stroke:#888780;stroke-width:1.2;}
  .box .th{fill:#2C2C2A;}.box .ts{fill:#4D4C48;}
  .c-blue rect{fill:#E6F1FB;stroke:#378ADD;stroke-width:1.2;}
  .c-blue .th{fill:#042C53;}.c-blue .ts{fill:#0C447C;}
  .c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:1.2;}
  .c-amber .th{fill:#412402;}.c-amber .ts{fill:#633806;}
  rect.c-blue{fill:#85B7EB;stroke:#185FA5;stroke-width:1;}
  rect.c-amber{fill:#EF9F27;stroke:#854F0B;stroke-width:1;}
  rect.box{fill:#B4B2A9;stroke:#5F5E5A;stroke-width:1;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect class="c-blue" x="150" y="29" width="13" height="13" rx="2"/>
  <text class="ts" x="170" y="36" dominant-baseline="central">Rules you author</text>
  <rect class="c-amber" x="322" y="29" width="13" height="13" rx="2"/>
  <text class="ts" x="342" y="36" dominant-baseline="central">Engine output</text>
  <rect class="box" x="476" y="29" width="13" height="13" rx="2"/>
  <text class="ts" x="496" y="36" dominant-baseline="central">Input data</text>

  <g class="box">
    <rect x="140" y="58" width="400" height="56" rx="10"/>
    <text class="th" x="340" y="82" text-anchor="middle" dominant-baseline="central">Indicator inputs</text>
    <text class="ts" x="340" y="102" text-anchor="middle" dominant-baseline="central">drv_cat_atomic_input + drv_ma &#8212; per symbol &amp; date</text>
  </g>
  <line class="arr" x1="340" y1="116" x2="340" y2="153" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="140" y="156" width="400" height="84" rx="10"/>
    <text class="th" x="340" y="181" text-anchor="middle" dominant-baseline="central">1 &#183; Atomic rules</text>
    <text class="ts" x="340" y="203" text-anchor="middle" dominant-baseline="central">ref_trig_atomic_rule &#8212; single-condition predicates</text>
    <text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">eval_atomic_rule &#8594; weight (jump / linear / sigmoid)</text>
  </g>
  <line class="arr" x1="340" y1="242" x2="340" y2="279" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="140" y="282" width="400" height="104" rx="10"/>
    <text class="th" x="340" y="307" text-anchor="middle" dominant-baseline="central">2 &#183; Composite rules</text>
    <text class="ts" x="340" y="329" text-anchor="middle" dominant-baseline="central">ref_trig_composite_mapping &#8212; sum of scored members</text>
    <text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">members: atomic &#183; data &#183; nested composite</text>
    <text class="ts" x="340" y="367" text-anchor="middle" dominant-baseline="central">precondition gate &#183; fires if any member contributes</text>
  </g>
  <line class="arr" x1="340" y1="388" x2="340" y2="425" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="140" y="428" width="400" height="84" rx="10"/>
    <text class="th" x="340" y="453" text-anchor="middle" dominant-baseline="central">3 &#183; Rule groups</text>
    <text class="ts" x="340" y="475" text-anchor="middle" dominant-baseline="central">ref_trig_rule_group + ref_trig_group_member</text>
    <text class="ts" x="340" y="494" text-anchor="middle" dominant-baseline="central">AND / OR over composites &#8594; action_label + priority</text>
  </g>
  <line class="arr" x1="340" y1="514" x2="340" y2="551" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="140" y="554" width="400" height="62" rx="10"/>
    <text class="th" x="340" y="578" text-anchor="middle" dominant-baseline="central">drv_stks &#8212; raw per-symbol engine output</text>
    <text class="ts" x="340" y="599" text-anchor="middle" dominant-baseline="central">triggered_atomic / composite / group _ids (JSONB)</text>
  </g>
  <line class="arr" x1="340" y1="618" x2="340" y2="655" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="140" y="658" width="400" height="84" rx="10"/>
    <text class="th" x="340" y="683" text-anchor="middle" dominant-baseline="central">drv_actionable &#8212; consolidated action</text>
    <text class="ts" x="340" y="705" text-anchor="middle" dominant-baseline="central">derive_actionable: most-aggressive action wins,</text>
    <text class="ts" x="340" y="724" text-anchor="middle" dominant-baseline="central">+ position-rule suppression + dollar sizing</text>
  </g>
</svg>
