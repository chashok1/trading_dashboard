<svg width="100%" viewBox="0 0 680 910" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Actionable decision logic</title>
  <desc>Vertical logic diagram of the outlook-action to actionable path: six outlook sources feed four per-source classifiers that write drv_outlook_action; derive_actionable then consolidates the per-source actions and rule-group fires into one winning action, sizes the dollar target, applies suppression, and writes drv_actionable.</desc>
  <style>
  svg{background:#ffffff;}
  text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#57564E;}
  .th{font-size:14px;font-weight:600;}
  .ts{font-size:11.5px;}
  .tsx{font-size:10.5px;}
  .arr{stroke:#888780;stroke-width:1.6;fill:none;}
  .box rect{fill:#F1EFE8;stroke:#888780;stroke-width:1.2;}
  .box .th{fill:#2C2C2A;}.box .ts{fill:#4D4C48;}.box .tsx{fill:#4D4C48;}
  .c-blue rect{fill:#E6F1FB;stroke:#378ADD;stroke-width:1.2;}
  .c-blue .th{fill:#042C53;}.c-blue .ts{fill:#0C447C;}.c-blue .tsx{fill:#0C447C;}
  .c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:1.2;}
  .c-amber .th{fill:#412402;}.c-amber .ts{fill:#633806;}
  rect.s-blue{fill:#85B7EB;stroke:#185FA5;stroke-width:1;}
  rect.s-amber{fill:#EF9F27;stroke:#854F0B;stroke-width:1;}
  rect.s-gray{fill:#B4B2A9;stroke:#5F5E5A;stroke-width:1;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect class="s-blue" x="150" y="24" width="13" height="13" rx="2"/>
  <text class="ts" x="170" y="31" dominant-baseline="central">Logic step</text>
  <rect class="s-amber" x="300" y="24" width="13" height="13" rx="2"/>
  <text class="ts" x="320" y="31" dominant-baseline="central">Derived table</text>
  <rect class="s-gray" x="470" y="24" width="13" height="13" rx="2"/>
  <text class="ts" x="490" y="31" dominant-baseline="central">Input / config</text>

  <g class="box">
    <rect x="40" y="52" width="600" height="88" rx="10"/>
    <text class="th" x="340" y="80" text-anchor="middle" dominant-baseline="central">Outlook sources — ref_outlook_source (6 active)</text>
    <text class="ts" x="340" y="104" text-anchor="middle" dominant-baseline="central">RR daily · ETF weekly (Sun) · II weekly (Mon) · CALL 30-day window</text>
    <text class="ts" x="340" y="123" text-anchor="middle" dominant-baseline="central">SSS weekly (Mon) · PS weekly (Fri) — base_weight_method selects the classifier</text>
  </g>
  <line class="arr" x1="340" y1="141" x2="340" y2="176" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="40" y="178" width="600" height="160" rx="10"/>
    <text class="th" x="340" y="202" text-anchor="middle" dominant-baseline="central">1 · Per-source classifiers — derive_outlook_action.py</text>
    <text class="ts" x="340" y="224" text-anchor="middle" dominant-baseline="central">each source compares its current snapshot to the prior one in its window</text>
    <text class="tsx" x="340" y="250" text-anchor="middle" dominant-baseline="central">outlook_v2 (RR, ETF, II):  new + weight &gt; 2 → ADD · dropped → REMOVE · shift → INCREASE/REDUCE</text>
    <text class="tsx" x="340" y="271" text-anchor="middle" dominant-baseline="central">call_standing (CALL):  30-day standing model · positive → ADD/INCREASE · weight ≤ 0 → REMOVE (held)</text>
    <text class="tsx" x="340" y="292" text-anchor="middle" dominant-baseline="central">rank (PS):  weekly rank · improved → INCREASE · degraded → REDUCE · new → ADD</text>
    <text class="tsx" x="340" y="313" text-anchor="middle" dominant-baseline="central">sss_pct_delta (SSS):  weekly pct_delta drives action · INCREASE/REDUCE informational only</text>
  </g>
  <line class="arr" x1="340" y1="339" x2="340" y2="374" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="40" y="376" width="600" height="58" rx="10"/>
    <text class="th" x="340" y="396" text-anchor="middle" dominant-baseline="central">drv_outlook_action — one row per (symbol, source)</text>
    <text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">real signals only · action + reason + base/prev weights</text>
  </g>
  <line class="arr" x1="340" y1="435" x2="340" y2="470" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="40" y="472" width="600" height="120" rx="10"/>
    <text class="th" x="340" y="495" text-anchor="middle" dominant-baseline="central">2 · Consolidation — derive_actionable.py</text>
    <text class="ts" x="340" y="519" text-anchor="middle" dominant-baseline="central">every per-source action + fired rule groups (RULES:code) compete together</text>
    <text class="ts" x="340" y="540" text-anchor="middle" dominant-baseline="central">winner = sort by (−ACTION_RANK, priority) — most aggressive wins, ties by priority</text>
    <text class="ts" x="340" y="561" text-anchor="middle" dominant-baseline="central">ACTION_RANK:  REMOVE 4 · REDUCE 3 · INCREASE 2 · ADD 1 · HOLD 0</text>
    <text class="ts" x="340" y="582" text-anchor="middle" dominant-baseline="central">SSS INCREASE / REDUCE are excluded from the winner contest</text>
  </g>
  <line class="arr" x1="340" y1="593" x2="340" y2="628" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="40" y="630" width="600" height="152" rx="10"/>
    <text class="th" x="340" y="654" text-anchor="middle" dominant-baseline="central">3 · Category → sizing → suppression</text>
    <text class="ts" x="340" y="678" text-anchor="middle" dominant-baseline="central">category → ref_asset_allocation → MIN, MAX, Units, maintain_min</text>
    <text class="ts" x="340" y="699" text-anchor="middle" dominant-baseline="central">REMOVE → target 0      ADD → MIN      HOLD → unchanged</text>
    <text class="ts" x="340" y="720" text-anchor="middle" dominant-baseline="central">INCREASE → min(held + Units, MAX);   not held → min(MIN + Units, MAX)</text>
    <text class="ts" x="340" y="741" text-anchor="middle" dominant-baseline="central">REDUCE → max(MIN, held − Units)   ·   maintain_min holds the floor</text>
    <text class="ts" x="340" y="762" text-anchor="middle" dominant-baseline="central">suppressed: NOT HELD · ALREADY ESTABLISHED · AT CEILING · AT FLOOR</text>
  </g>
  <line class="arr" x1="340" y1="783" x2="340" y2="818" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="40" y="820" width="600" height="72" rx="10"/>
    <text class="th" x="340" y="846" text-anchor="middle" dominant-baseline="central">drv_actionable — one row per symbol per date</text>
    <text class="ts" x="340" y="868" text-anchor="middle" dominant-baseline="central">consolidated_action · winning_source · suggested_target_dollar · suppressed_reason</text>
  </g>
</svg>
