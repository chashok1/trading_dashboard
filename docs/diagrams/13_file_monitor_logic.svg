<svg width="100%" viewBox="0 0 680 960" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>File Monitor schedule-status and missing-derive logic</title>
  <desc>Vertical logic diagram showing: for each ref_load_files slot (file_type, week_day, file_time) the window_start CTE computes the expected date; two LATERAL joins find the latest meta_file_processed row whose processed_at::time is >= file_time; the result drives a five-value status (running, error, overdue, pending, done/optional/not-today). A separate path shows missing-derive detection: snapshot_dates present in hist_* but absent from meta_derived_run success rows are collected oldest-to-newest and passed to derive_all.</desc>
  <style>
  svg{background:#ffffff;}
  text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#57564E;}
  .th{font-size:14px;font-weight:600;}
  .ts{font-size:11.5px;}
  .tsx{font-size:10.5px;}
  .arr{stroke:#888780;stroke-width:1.6;fill:none;}
  .box rect{fill:#F1EFE8;stroke:#888780;stroke-width:1.2;}
  .box .th{fill:#2C2C2A;}.box .ts{fill:#4D4C48;}.box .tsx{fill:#4D4C48;}
  .c-blue rect{fill:#E6F1FB;stroke:#378ADD;stroke-width:1.2;}
  .c-blue .th{fill:#042C53;}.c-blue .ts{fill:#0C447C;}.c-blue .tsx{fill:#0C447C;}
  .c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:1.2;}
  .c-amber .th{fill:#412402;}.c-amber .ts{fill:#633806;}
  rect.s-blue{fill:#85B7EB;stroke:#185FA5;stroke-width:1;}
  rect.s-amber{fill:#EF9F27;stroke:#854F0B;stroke-width:1;}
  rect.s-gray{fill:#B4B2A9;stroke:#5F5E5A;stroke-width:1;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect class="s-blue"  x="150" y="24" width="13" height="13" rx="2"/>
  <text class="ts" x="170" y="31" dominant-baseline="central">Logic step</text>
  <rect class="s-amber" x="300" y="24" width="13" height="13" rx="2"/>
  <text class="ts" x="320" y="31" dominant-baseline="central">Status output</text>
  <rect class="s-gray"  x="470" y="24" width="13" height="13" rx="2"/>
  <text class="ts" x="490" y="31" dominant-baseline="central">Input / config table</text>

  <!-- ── PART 1: Schedule-status path ── -->

  <!-- Box 1: ref_load_files -->
  <g class="box">
    <rect x="40" y="52" width="600" height="78" rx="10"/>
    <text class="th"  x="340" y="76"  text-anchor="middle" dominant-baseline="central">ref_load_files — schedule configuration</text>
    <text class="ts"  x="340" y="98"  text-anchor="middle" dominant-baseline="central">PK (file_type, week_day, file_time) — one row per schedule slot</text>
    <text class="tsx" x="340" y="118" text-anchor="middle" dominant-baseline="central">week_day: WKDAY · MON–SUN · ALL   ·   file_time: expected arrival time (e.g. 16:00)</text>
  </g>
  <line class="arr" x1="340" y1="131" x2="340" y2="166" marker-end="url(#arrow)"/>

  <!-- Box 2: window_start CTE -->
  <g class="c-blue">
    <rect x="40" y="168" width="600" height="100" rx="10"/>
    <text class="th"  x="340" y="192" text-anchor="middle" dominant-baseline="central">1 · window_start CTE — expected calendar date per slot</text>
    <text class="ts"  x="340" y="214" text-anchor="middle" dominant-baseline="central">Specific day (MON–SUN):  CURRENT_DATE − ((DOW_current − DOW_scheduled + 7) % 7)</text>
    <text class="ts"  x="340" y="234" text-anchor="middle" dominant-baseline="central">WKDAY:  today if weekday · most recent Friday if weekend</text>
    <text class="ts"  x="340" y="254" text-anchor="middle" dominant-baseline="central">ALL:  always CURRENT_DATE</text>
  </g>
  <line class="arr" x1="340" y1="269" x2="340" y2="304" marker-end="url(#arrow)"/>

  <!-- Box 3: LATERAL joins -->
  <g class="c-blue">
    <rect x="40" y="306" width="600" height="120" rx="10"/>
    <text class="th"  x="340" y="330" text-anchor="middle" dominant-baseline="central">2 · LATERAL joins against meta_file_processed</text>
    <text class="ts"  x="340" y="354" text-anchor="middle" dominant-baseline="central">fp (today):  latest row WHERE file_date = today AND processed_at::time &gt;= r.file_time</text>
    <text class="ts"  x="340" y="374" text-anchor="middle" dominant-baseline="central">lp (any date):  latest row for any date WHERE processed_at::time &gt;= r.file_time</text>
    <text class="tsx" x="340" y="396" text-anchor="middle" dominant-baseline="central">A file at 16:05 satisfies the 16:00 slot but NOT the 17:00 slot — each slot is evaluated independently</text>
    <text class="tsx" x="340" y="414" text-anchor="middle" dominant-baseline="central">lp.file_date &gt;= window_date means an in-window file from a prior day still counts as done</text>
  </g>
  <line class="arr" x1="340" y1="427" x2="340" y2="462" marker-end="url(#arrow)"/>

  <!-- Box 4: Status decision (amber = output) -->
  <g class="c-amber">
    <rect x="40" y="464" width="600" height="162" rx="10"/>
    <text class="th"  x="340" y="487" text-anchor="middle" dominant-baseline="central">3 · Status decision — priority order</text>
    <text class="ts"  x="340" y="510" text-anchor="middle" dominant-baseline="central">running   — meta_etl_run.status = 'running' for this file_type</text>
    <text class="ts"  x="340" y="530" text-anchor="middle" dominant-baseline="central">error     — most recent ETL run ended with status = 'error'</text>
    <text class="ts"  x="340" y="550" text-anchor="middle" dominant-baseline="central">overdue   — expected today · CURRENT_TIME &gt;= file_time · no qualifying fp or lp row</text>
    <text class="ts"  x="340" y="570" text-anchor="middle" dominant-baseline="central">pending   — expected today · CURRENT_TIME &lt; file_time (or file_time NULL)</text>
    <text class="ts"  x="340" y="590" text-anchor="middle" dominant-baseline="central">done      — fp today OR lp with file_date &gt;= window_date (both constrained by file_time)</text>
    <text class="tsx" x="340" y="610" text-anchor="middle" dominant-baseline="central">optional / not today — ref_load_files.optional=TRUE or week_day does not match today</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="650" x2="640" y2="650" stroke="#C8C6BE" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts" x="340" y="660" text-anchor="middle" dominant-baseline="central" fill="#888780">— Missing-derive detection path —</text>

  <!-- Box 5: hist_dates union -->
  <g class="box">
    <rect x="40" y="672" width="600" height="68" rx="10"/>
    <text class="th"  x="340" y="694" text-anchor="middle" dominant-baseline="central">4 · hist_dates — snapshot dates with raw data</text>
    <text class="ts"  x="340" y="714" text-anchor="middle" dominant-baseline="central">UNION of DISTINCT snapshot_date from hist_cs · hist_f · hist_tl · hist_td</text>
    <text class="tsx" x="340" y="730" text-anchor="middle" dominant-baseline="central">optionally filtered to CURRENT_DATE − last_n_days (1 · 3 · 7 · 14 · 30 · 60 · 90)</text>
  </g>
  <line class="arr" x1="340" y1="741" x2="340" y2="776" marker-end="url(#arrow)"/>

  <!-- Box 6: anti-join against meta_derived_run -->
  <g class="c-blue">
    <rect x="40" y="778" width="600" height="78" rx="10"/>
    <text class="th"  x="340" y="800" text-anchor="middle" dominant-baseline="central">5 · Anti-join against meta_derived_run</text>
    <text class="ts"  x="340" y="822" text-anchor="middle" dominant-baseline="central">keep dates NOT IN (SELECT as_of_date FROM meta_derived_run WHERE status = 'success')</text>
    <text class="tsx" x="340" y="842" text-anchor="middle" dominant-baseline="central">force=True flips this: returns dates that DO have a success row (for re-applying code changes)</text>
  </g>
  <line class="arr" x1="340" y1="857" x2="340" y2="892" marker-end="url(#arrow)"/>

  <!-- Box 7: derive_all (amber = output action) -->
  <g class="c-amber">
    <rect x="40" y="894" width="600" height="50" rx="10"/>
    <text class="th"  x="340" y="914" text-anchor="middle" dominant-baseline="central">6 · derive_all(session, date) — oldest date first</text>
    <text class="ts"  x="340" y="934" text-anchor="middle" dominant-baseline="central">per-date failures caught and logged · loop continues to next date · writes meta_derived_run</text>
  </g>
</svg>
