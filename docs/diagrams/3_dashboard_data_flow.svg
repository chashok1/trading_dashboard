<svg width="100%" viewBox="0 0 680 670" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dashboard screen data flow</title>
  <desc>Fan-in data flow for the Dashboard screen, showing the condensed upstream pipeline, three source-table groups feeding three API endpoint groups, which in turn feed the six UI regions of the dashboard.</desc>
  <style>
  svg{background:#ffffff;}
  text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#2C2C2A;}
  .t{font-size:14px;}.ts{font-size:12px;}.th{font-size:14px;font-weight:600;}
  .arr{stroke:#888888;stroke-width:1.5;fill:none;}
  .c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;}.c-gray text{fill:#2C2C2A;}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5;}.c-blue text{fill:#042C53;}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56;}.c-teal text{fill:#04342C;}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7;}.c-purple text{fill:#26215C;}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D;}.c-coral text{fill:#4A1B0C;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-purple">
    <rect x="40" y="30" width="600" height="78" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Upstream pipeline</text>
    <text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">triggers → etl_load.py → 17 hist_* tables</text>
    <text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">→ derive_all cascade (see actionable diagram)</text>
  </g>

  <line x1="340" y1="108" x2="340" y2="128" stroke="#888" stroke-width="0.5"/>
  <line x1="135" y1="128" x2="545" y2="128" stroke="#888" stroke-width="0.5"/>
  <line x1="135" y1="128" x2="135" y2="158" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="128" x2="340" y2="158" class="arr" marker-end="url(#arrow)"/>
  <line x1="545" y1="128" x2="545" y2="158" class="arr" marker-end="url(#arrow)"/>

  <g class="c-coral">
    <rect x="40" y="160" width="190" height="130" rx="8" stroke-width="0.5"/>
    <text class="th" x="135" y="182" text-anchor="middle" dominant-baseline="central">Core snapshot</text>
    <text class="ts" x="135" y="210" text-anchor="middle" dominant-baseline="central">drv_dash</text>
    <text class="ts" x="135" y="228" text-anchor="middle" dominant-baseline="central">drv_dash_summary</text>
  </g>
  <g class="c-coral">
    <rect x="245" y="160" width="190" height="130" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="182" text-anchor="middle" dominant-baseline="central">Outlook + Briefing</text>
    <text class="ts" x="340" y="210" text-anchor="middle" dominant-baseline="central">drv_outlook_action</text>
    <text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">drv_actionable</text>
    <text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">user_action_log</text>
    <text class="ts" x="340" y="264" text-anchor="middle" dominant-baseline="central">+ ref/meta tables</text>
  </g>
  <g class="c-gray">
    <rect x="450" y="160" width="190" height="130" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="182" text-anchor="middle" dominant-baseline="central">Reference feeds</text>
    <text class="ts" x="545" y="210" text-anchor="middle" dominant-baseline="central">ref_econ_indicator</text>
    <text class="ts" x="545" y="228" text-anchor="middle" dominant-baseline="central">ref_quad_periods</text>
    <text class="ts" x="545" y="246" text-anchor="middle" dominant-baseline="central">ref_calendar_event</text>
  </g>

  <line x1="135" y1="290" x2="135" y2="328" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="290" x2="340" y2="328" class="arr" marker-end="url(#arrow)"/>
  <line x1="545" y1="290" x2="545" y2="328" class="arr" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="40" y="330" width="190" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="135" y="352" text-anchor="middle" dominant-baseline="central">/api/dash</text>
    <text class="ts" x="135" y="374" text-anchor="middle" dominant-baseline="central">+ /api/dash/summary</text>
  </g>
  <g class="c-gray">
    <rect x="245" y="330" width="190" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="352" text-anchor="middle" dominant-baseline="central">/api/outlook/changes</text>
    <text class="ts" x="340" y="374" text-anchor="middle" dominant-baseline="central">+ /api/briefing</text>
  </g>
  <g class="c-gray">
    <rect x="450" y="330" width="190" height="64" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="352" text-anchor="middle" dominant-baseline="central">/api/dashboard/*</text>
    <text class="ts" x="545" y="374" text-anchor="middle" dominant-baseline="central">econ, earnings, quads</text>
  </g>

  <line x1="135" y1="394" x2="340" y2="416" stroke="#888" stroke-width="0.5"/>
  <line x1="340" y1="394" x2="340" y2="416" stroke="#888" stroke-width="0.5"/>
  <line x1="545" y1="394" x2="340" y2="416" stroke="#888" stroke-width="0.5"/>
  <line x1="340" y1="416" x2="340" y2="432" class="arr" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="40" y="434" width="600" height="190" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="458" text-anchor="middle" dominant-baseline="central">Dashboard screen (index.html + app.js)</text>
    <text class="ts" x="340" y="476" text-anchor="middle" dominant-baseline="central">six UI regions, each backed by its own feed</text>
  </g>
  <g class="c-gray">
    <rect x="60" y="496" width="180" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="150" y="514" text-anchor="middle" dominant-baseline="central">Index bar</text>
  </g>
  <g class="c-gray">
    <rect x="250" y="496" width="180" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="340" y="514" text-anchor="middle" dominant-baseline="central">Outlook banner</text>
  </g>
  <g class="c-gray">
    <rect x="440" y="496" width="180" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="530" y="514" text-anchor="middle" dominant-baseline="central">Briefing card</text>
  </g>
  <g class="c-gray">
    <rect x="60" y="546" width="135" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="127" y="564" text-anchor="middle" dominant-baseline="central">Ticker sections</text>
  </g>
  <g class="c-gray">
    <rect x="205" y="546" width="135" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="272" y="564" text-anchor="middle" dominant-baseline="central">Quad periods</text>
  </g>
  <g class="c-gray">
    <rect x="350" y="546" width="135" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="417" y="564" text-anchor="middle" dominant-baseline="central">Econ indicators</text>
  </g>
  <g class="c-gray">
    <rect x="495" y="546" width="135" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="562" y="564" text-anchor="middle" dominant-baseline="central">Earnings events</text>
  </g>
</svg>
