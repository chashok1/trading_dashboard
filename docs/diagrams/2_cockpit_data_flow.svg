<svg width="100%" viewBox="0 0 680 835" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cockpit screen data flow</title>
  <desc>End-to-end data flow showing the three trigger sources, etl_load into 17 hist_* tables, the gated derive_all cascade ending at drv_stks (rules engine), the FastAPI layer joining drv_stks with drv_ma, the Cockpit UI with its detail drawer, and the user_action_log feedback table.</desc>
  <style>
  svg{background:#ffffff;}
  text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#2C2C2A;}
  .t{font-size:14px;}.ts{font-size:12px;}.th{font-size:14px;font-weight:600;}
  .arr{stroke:#888888;stroke-width:1.5;fill:none;}
  .c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;}.c-gray text{fill:#2C2C2A;}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5;}.c-blue text{fill:#042C53;}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56;}.c-teal text{fill:#04342C;}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7;}.c-purple text{fill:#26215C;}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D;}.c-coral text{fill:#4A1B0C;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-gray">
    <rect x="50" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="140" y="52" text-anchor="middle" dominant-baseline="central">Folder watcher</text>
    <text class="ts" x="140" y="70" text-anchor="middle" dominant-baseline="central">watchdog on 17 dirs</text>
  </g>
  <g class="c-gray">
    <rect x="250" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">File Monitor UI</text>
    <text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">reprocess, missing derives</text>
  </g>
  <g class="c-gray">
    <rect x="450" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="540" y="52" text-anchor="middle" dominant-baseline="central">Bootstrap</text>
    <text class="ts" x="540" y="70" text-anchor="middle" dominant-baseline="central">tickers_initial_load</text>
  </g>

  <line x1="140" y1="86" x2="340" y2="106" stroke="#888" stroke-width="0.5"/>
  <line x1="340" y1="86" x2="340" y2="106" stroke="#888" stroke-width="0.5"/>
  <line x1="540" y1="86" x2="340" y2="106" stroke="#888" stroke-width="0.5"/>
  <line x1="340" y1="106" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="180" y="120" width="320" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central">etl_load.py · load_one_file</text>
    <text class="ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">HIST_MAPS or CUSTOM_HANDLERS</text>
  </g>
  <line x1="340" y1="176" x2="340" y2="208" class="arr" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="180" y="210" width="320" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="232" text-anchor="middle" dominant-baseline="central">17 hist_* tables</text>
    <text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">ON CONFLICT DO NOTHING, 1000-row batches</text>
  </g>

  <line x1="340" y1="266" x2="340" y2="308" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="287" text-anchor="start" fill="#5F5E5A">if TD_RUN_DERIVE=1</text>

  <g class="c-purple">
    <rect x="40" y="310" width="600" height="110" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="334" text-anchor="middle" dominant-baseline="central">derive_all(as_of_date)</text>
    <text class="ts" x="340" y="352" text-anchor="middle" dominant-baseline="central">idempotent: DELETE WHERE as_of_date=D then INSERT</text>
  </g>
  <g class="c-gray">
    <rect x="80" y="370" width="520" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="340" y="388" text-anchor="middle" dominant-baseline="central">drv_td · drv_tw · drv_quote · drv_ma</text>
  </g>

  <line x1="340" y1="420" x2="340" y2="450" class="arr" marker-end="url(#arrow)"/>

  <g class="c-coral">
    <rect x="40" y="452" width="400" height="78" rx="10" stroke-width="0.5"/>
    <text class="th" x="240" y="476" text-anchor="middle" dominant-baseline="central">drv_stks</text>
    <text class="ts" x="240" y="496" text-anchor="middle" dominant-baseline="central">rules engine output: 1 row per symbol/date</text>
    <text class="ts" x="240" y="514" text-anchor="middle" dominant-baseline="central">triggered_atomic_ids, triggered_composite_ids (JSONB)</text>
  </g>
  <g class="c-gray">
    <rect x="460" y="452" width="180" height="78" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="472" text-anchor="middle" dominant-baseline="central">Sidecar</text>
    <text class="ts" x="550" y="490" text-anchor="middle" dominant-baseline="central">drv_ma supplies</text>
    <text class="ts" x="550" y="506" text-anchor="middle" dominant-baseline="central">price, RSI, sector,</text>
    <text class="ts" x="550" y="522" text-anchor="middle" dominant-baseline="central">SMA, IV (~40 cols)</text>
  </g>
  <line x1="460" y1="491" x2="446" y2="491" class="arr" marker-end="url(#arrow)"/>

  <line x1="240" y1="530" x2="240" y2="558" class="arr" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="80" y="560" width="520" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="582" text-anchor="middle" dominant-baseline="central">FastAPI · /api/stks</text>
    <text class="ts" x="340" y="600" text-anchor="middle" dominant-baseline="central">drv_ma LEFT JOIN drv_stks on (as_of_date, symbol)</text>
  </g>
  <line x1="340" y1="616" x2="340" y2="646" class="arr" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="80" y="648" width="520" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="670" text-anchor="middle" dominant-baseline="central">Cockpit screen (cockpit.js)</text>
    <text class="ts" x="340" y="688" text-anchor="middle" dominant-baseline="central">actions table + drawer (chart, atomic rules, composite rules)</text>
  </g>

  <line x1="340" y1="704" x2="340" y2="736" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="719" text-anchor="start" fill="#5F5E5A">user clicks ACTED / SKIP</text>

  <g class="c-coral">
    <rect x="180" y="738" width="320" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="760" text-anchor="middle" dominant-baseline="central">user_action_log</text>
    <text class="ts" x="340" y="778" text-anchor="middle" dominant-baseline="central">via /api/actions, with triggered_rules JSONB</text>
  </g>
</svg>
