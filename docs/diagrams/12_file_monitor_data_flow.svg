<svg width="100%" viewBox="0 0 680 970" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>File Monitor data flow</title>
  <desc>End-to-end data flow: source folders are watched by the watchdog scheduler; on a file event load_one_file runs, inserting into hist_* tables and recording meta_etl_run and meta_file_processed; derive_all runs in-process writing drv_* tables and meta_derived_run; the monitor API exposes all of this to the File Monitor UI, which also receives a live SSE stream of running jobs.</desc>
  <style>
  svg{background:#ffffff;}
  text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#2C2C2A;}
  .t{font-size:14px;}.ts{font-size:12px;}.th{font-size:14px;font-weight:600;}
  .arr{stroke:#888888;stroke-width:1.5;fill:none;}
  .c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;}.c-gray text{fill:#2C2C2A;}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5;}.c-blue text{fill:#042C53;}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56;}.c-teal text{fill:#04342C;}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7;}.c-purple text{fill:#26215C;}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D;}.c-coral text{fill:#4A1B0C;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Row 1: Three trigger sources -->
  <g class="c-gray">
    <rect x="30" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="120" y="52" text-anchor="middle" dominant-baseline="central">Source Folders</text>
    <text class="ts" x="120" y="70" text-anchor="middle" dominant-baseline="central">17 dirs from ref_load_files</text>
  </g>
  <g class="c-gray">
    <rect x="230" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="330" y="52" text-anchor="middle" dominant-baseline="central">File Monitor UI</text>
    <text class="ts" x="330" y="70" text-anchor="middle" dominant-baseline="central">Reprocess button · Run Missing Derives</text>
  </g>
  <g class="c-gray">
    <rect x="450" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="52" text-anchor="middle" dominant-baseline="central">CLI / Bootstrap</text>
    <text class="ts" x="550" y="70" text-anchor="middle" dominant-baseline="central">etl_load.py · tickers_initial_load</text>
  </g>

  <!-- Convergence lines to scheduler box -->
  <line x1="120" y1="86" x2="330" y2="116" stroke="#888" stroke-width="0.5"/>
  <line x1="330" y1="86" x2="330" y2="116" stroke="#888" stroke-width="0.5"/>
  <line x1="550" y1="86" x2="330" y2="116" stroke="#888" stroke-width="0.5"/>
  <line x1="330" y1="116" x2="330" y2="128" class="arr" marker-end="url(#arrow)"/>

  <!-- Row 2: Watchdog scheduler -->
  <g class="c-purple">
    <rect x="30" y="130" width="620" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="153" text-anchor="middle" dominant-baseline="central">etl/scheduler.py — watchdog folder-watch</text>
    <text class="ts" x="340" y="173" text-anchor="middle" dominant-baseline="central">debounce 30 s · quiesce 2 s · wait for readable · OS lock (scheduler.lock)</text>
  </g>
  <line x1="340" y1="196" x2="340" y2="228" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="212" text-anchor="start" fill="#5F5E5A">file event (created / modified)</text>

  <!-- Row 3: load_one_file -->
  <g class="c-purple">
    <rect x="30" y="230" width="620" height="86" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="256" text-anchor="middle" dominant-baseline="central">etl/etl_load.py — load_one_file</text>
    <text class="ts" x="340" y="277" text-anchor="middle" dominant-baseline="central">already-processed check (meta_file_processed) · copy to ETL_WORKING_DIR</text>
    <text class="ts" x="340" y="297" text-anchor="middle" dominant-baseline="central">CUSTOM_HANDLERS (etf, etfchg, iichg, ref_tickers) or HIST_MAPS generic loader</text>
  </g>
  <line x1="340" y1="316" x2="340" y2="348" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="332" text-anchor="start" fill="#5F5E5A">1000-row batch commits · ON CONFLICT DO NOTHING</text>

  <!-- Row 4: hist_* tables + meta bookkeeping (side by side) -->
  <g class="c-gray">
    <rect x="30" y="350" width="380" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="220" y="372" text-anchor="middle" dominant-baseline="central">hist_* tables (17)</text>
    <text class="ts" x="220" y="392" text-anchor="middle" dominant-baseline="central">append-only · PK (snapshot_date, symbol[, …])</text>
  </g>
  <g class="c-gray">
    <rect x="428" y="350" width="222" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="539" y="372" text-anchor="middle" dominant-baseline="central">meta bookkeeping</text>
    <text class="ts" x="539" y="392" text-anchor="middle" dominant-baseline="central">meta_etl_run · meta_file_processed</text>
  </g>

  <!-- Arrow from hist tables down to derive -->
  <line x1="220" y1="416" x2="340" y2="448" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="230" y="432" text-anchor="start" fill="#5F5E5A">derive runs in-process (skip: --no-derive)</text>

  <!-- Row 5: derive_all cascade -->
  <g class="c-purple">
    <rect x="30" y="450" width="620" height="178" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="474" text-anchor="middle" dominant-baseline="central">etl/derive.py — derive_all(as_of_date)</text>
    <text class="ts" x="340" y="494" text-anchor="middle" dominant-baseline="central">idempotent: DELETE WHERE as_of_date=D then INSERT</text>
  </g>
  <g class="c-gray">
    <rect x="60" y="510" width="560" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="340" y="528" text-anchor="middle" dominant-baseline="central">Base layer: drv_quote · drv_td · drv_tw · drv_ssh</text>
  </g>
  <line x1="340" y1="546" x2="340" y2="560" class="arr" marker-end="url(#arrow)"/>
  <g class="c-gray">
    <rect x="60" y="562" width="175" height="50" rx="6" stroke-width="0.5"/>
    <text class="th" x="147" y="582" text-anchor="middle" dominant-baseline="central">drv_ma</text>
    <text class="ts" x="147" y="600" text-anchor="middle" dominant-baseline="central">master aggregate</text>
  </g>
  <g class="c-gray">
    <rect x="253" y="562" width="175" height="50" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="582" text-anchor="middle" dominant-baseline="central">drv_stks</text>
    <text class="ts" x="340" y="600" text-anchor="middle" dominant-baseline="central">rules engine fires</text>
  </g>
  <g class="c-gray">
    <rect x="445" y="562" width="175" height="50" rx="6" stroke-width="0.5"/>
    <text class="th" x="532" y="582" text-anchor="middle" dominant-baseline="central">drv_actionable</text>
    <text class="ts" x="532" y="600" text-anchor="middle" dominant-baseline="central">consolidated actions</text>
  </g>

  <!-- meta_derived_run off to side -->
  <line x1="340" y1="628" x2="340" y2="658" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="643" text-anchor="start" fill="#5F5E5A">forward re-derive for dates after file_dt if backfilled</text>

  <!-- Row 6: meta_derived_run -->
  <g class="c-gray">
    <rect x="30" y="660" width="620" height="46" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="678" text-anchor="middle" dominant-baseline="central">meta_derived_run</text>
    <text class="ts" x="340" y="696" text-anchor="middle" dominant-baseline="central">one row per (as_of_date, target_table) · status success / error · rows_built</text>
  </g>

  <line x1="340" y1="706" x2="340" y2="738" class="arr" marker-end="url(#arrow)"/>

  <!-- Row 7: Monitor API -->
  <g class="c-blue">
    <rect x="30" y="740" width="620" height="86" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="764" text-anchor="middle" dominant-baseline="central">FastAPI · api/routers/monitor.py</text>
    <text class="ts" x="340" y="784" text-anchor="middle" dominant-baseline="central">/summary · /schedule · /etl-runs · /derive-runs · /reprocess</text>
    <text class="ts" x="340" y="804" text-anchor="middle" dominant-baseline="central">/derive-missing · /derive-missing/run · /scheduler · /startup</text>
  </g>
  <line x1="340" y1="826" x2="340" y2="858" class="arr" marker-end="url(#arrow)"/>

  <!-- Row 8: File Monitor UI -->
  <g class="c-gray">
    <rect x="30" y="860" width="440" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="250" y="882" text-anchor="middle" dominant-baseline="central">File Monitor UI (file_monitor.js)</text>
    <text class="ts" x="250" y="902" text-anchor="middle" dominant-baseline="central">KPI bar · Today's Schedule · Derive Pipeline</text>
    <text class="ts" x="250" y="920" text-anchor="middle" dominant-baseline="central">Recent ETL Loads · Scheduler Output</text>
  </g>
  <!-- SSE live stream -->
  <g class="c-teal">
    <rect x="490" y="860" width="160" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="570" y="882" text-anchor="middle" dominant-baseline="central">Live SSE</text>
    <text class="ts" x="570" y="902" text-anchor="middle" dominant-baseline="central">/api/monitor/live</text>
    <text class="ts" x="570" y="920" text-anchor="middle" dominant-baseline="central">polls every 5 s</text>
  </g>
  <line x1="490" y1="898" x2="476" y2="898" class="arr" marker-end="url(#arrow)"/>
</svg>
