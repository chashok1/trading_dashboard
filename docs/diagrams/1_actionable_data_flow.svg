<svg width="100%" viewBox="0 0 680 910" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Actionable screen data flow</title>
  <desc>End-to-end data flow showing the three trigger sources, the etl_load step into 17 hist_* tables, the gated derive_all cascade, drv_actionable as the resolved decision table, the FastAPI layer, the Actionable UI, and the user_action_log feedback.</desc>
  <style>
  svg{background:#ffffff;}
  text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#2C2C2A;}
  .t{font-size:14px;}.ts{font-size:12px;}.th{font-size:14px;font-weight:600;}
  .arr{stroke:#888888;stroke-width:1.5;fill:none;}
  .c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;}.c-gray text{fill:#2C2C2A;}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5;}.c-blue text{fill:#042C53;}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56;}.c-teal text{fill:#04342C;}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7;}.c-purple text{fill:#26215C;}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D;}.c-coral text{fill:#4A1B0C;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-gray">
    <rect x="50" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="140" y="52" text-anchor="middle" dominant-baseline="central">Folder watcher</text>
    <text class="ts" x="140" y="70" text-anchor="middle" dominant-baseline="central">watchdog on 17 dirs</text>
  </g>
  <g class="c-gray">
    <rect x="250" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">File Monitor UI</text>
    <text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">reprocess, missing derives</text>
  </g>
  <g class="c-gray">
    <rect x="450" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="540" y="52" text-anchor="middle" dominant-baseline="central">Bootstrap</text>
    <text class="ts" x="540" y="70" text-anchor="middle" dominant-baseline="central">tickers_initial_load</text>
  </g>

  <line x1="140" y1="86" x2="340" y2="106" stroke="#888" stroke-width="0.5"/>
  <line x1="340" y1="86" x2="340" y2="106" stroke="#888" stroke-width="0.5"/>
  <line x1="540" y1="86" x2="340" y2="106" stroke="#888" stroke-width="0.5"/>
  <line x1="340" y1="106" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="180" y="120" width="320" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central">etl_load.py · load_one_file</text>
    <text class="ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">HIST_MAPS or CUSTOM_HANDLERS</text>
  </g>
  <line x1="340" y1="176" x2="340" y2="208" class="arr" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="180" y="210" width="320" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="232" text-anchor="middle" dominant-baseline="central">17 hist_* tables</text>
    <text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">ON CONFLICT DO NOTHING, 1000-row batches</text>
  </g>

  <line x1="340" y1="266" x2="340" y2="308" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="287" text-anchor="start" fill="#5F5E5A">derive runs in-process (skip: --no-derive)</text>

  <g class="c-purple">
    <rect x="40" y="310" width="600" height="180" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="334" text-anchor="middle" dominant-baseline="central">derive_all(as_of_date)</text>
    <text class="ts" x="340" y="352" text-anchor="middle" dominant-baseline="central">idempotent: DELETE WHERE as_of_date=D then INSERT</text>
  </g>
  <g class="c-gray">
    <rect x="80" y="370" width="520" height="36" rx="6" stroke-width="0.5"/>
    <text class="t" x="340" y="388" text-anchor="middle" dominant-baseline="central">Base: drv_td, drv_tw, drv_quote</text>
  </g>
  <line x1="340" y1="406" x2="340" y2="423" class="arr" marker-end="url(#arrow)"/>
  <g class="c-gray">
    <rect x="70" y="425" width="170" height="54" rx="6" stroke-width="0.5"/>
    <text class="th" x="155" y="447" text-anchor="middle" dominant-baseline="central">drv_ma</text>
    <text class="ts" x="155" y="465" text-anchor="middle" dominant-baseline="central">master aggregate</text>
  </g>
  <g class="c-gray">
    <rect x="260" y="425" width="170" height="54" rx="6" stroke-width="0.5"/>
    <text class="th" x="345" y="447" text-anchor="middle" dominant-baseline="central">drv_stks</text>
    <text class="ts" x="345" y="465" text-anchor="middle" dominant-baseline="central">rules engine fires</text>
  </g>
  <g class="c-gray">
    <rect x="450" y="425" width="170" height="54" rx="6" stroke-width="0.5"/>
    <text class="th" x="535" y="447" text-anchor="middle" dominant-baseline="central">drv_outlook_action</text>
    <text class="ts" x="535" y="465" text-anchor="middle" dominant-baseline="central">per-source outlook</text>
  </g>

  <line x1="340" y1="490" x2="340" y2="520" class="arr" marker-end="url(#arrow)"/>

  <g class="c-coral">
    <rect x="40" y="522" width="400" height="78" rx="10" stroke-width="0.5"/>
    <text class="th" x="240" y="546" text-anchor="middle" dominant-baseline="central">drv_actionable</text>
    <text class="ts" x="240" y="566" text-anchor="middle" dominant-baseline="central">resolver: most-aggressive wins</text>
    <text class="ts" x="240" y="584" text-anchor="middle" dominant-baseline="central">1 row per symbol per date</text>
  </g>
  <g class="c-gray">
    <rect x="460" y="522" width="180" height="78" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="542" text-anchor="middle" dominant-baseline="central">Also reads</text>
    <text class="ts" x="550" y="560" text-anchor="middle" dominant-baseline="central">ref_my_stocks</text>
    <text class="ts" x="550" y="576" text-anchor="middle" dominant-baseline="central">ref_asset_allocation</text>
    <text class="ts" x="550" y="592" text-anchor="middle" dominant-baseline="central">holdings (hist_f, hist_cs)</text>
  </g>
  <line x1="460" y1="561" x2="446" y2="561" class="arr" marker-end="url(#arrow)"/>

  <line x1="240" y1="600" x2="240" y2="630" class="arr" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="80" y="632" width="520" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="654" text-anchor="middle" dominant-baseline="central">FastAPI · /api/actionable</text>
    <text class="ts" x="340" y="672" text-anchor="middle" dominant-baseline="central">dates · list · save action · history</text>
  </g>
  <line x1="340" y1="688" x2="340" y2="718" class="arr" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="80" y="720" width="520" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="742" text-anchor="middle" dominant-baseline="central">Actionable screen (actionable.js)</text>
    <text class="ts" x="340" y="760" text-anchor="middle" dominant-baseline="central">chips, grid, drilldown modal, composite popover</text>
  </g>

  <line x1="340" y1="776" x2="340" y2="806" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="791" text-anchor="start" fill="#5F5E5A">user saves decision</text>

  <g class="c-coral">
    <rect x="80" y="808" width="520" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="830" text-anchor="middle" dominant-baseline="central">user_action_log</text>
    <text class="ts" x="340" y="848" text-anchor="middle" dominant-baseline="central">forensic JSONB snapshot of decision</text>
  </g>
</svg>
