[pytest]
; TASK_114 (2026-07-04): exclude the acceptance bucket from the default run.
; Task-acceptance tests (tests/acceptance/, marked @pytest.mark.acceptance)
; are one-time checks for a historical task's deliverable — deletable after
; that task's commit, not part of the durable regression net. Run them
; explicitly with `pytest -m acceptance`. See docs/audit/test_debt_review.md
; §2 and CLAUDE.md's Conventions list.
addopts = -m "not acceptance"
